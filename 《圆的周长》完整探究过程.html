        &lt;/button&gt;
        &lt;button class=&quot;btn-success&quot; onclick=&quot;recordCurrentData()&quot; id=&quot;record-btn&quot; style=&quot;display: none;&quot;&gt;
            &lt;svg width=&quot;18&quot; height=&quot;18&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;path d=&quot;M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7&quot;&gt;&lt;/path&gt;&lt;path d=&quot;M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z&quot;&gt;&lt;/path&gt;&lt;/svg&gt;
            记录当前测量数据
        &lt;/button&gt;
        
        &lt;div style=&quot;display: flex; align-items: center; gap: 12px; flex: 1; max-width: 300px; margin-left: 20px;&quot; id=&quot;progress-container&quot;&gt;
            &lt;input type=&quot;range&quot; id=&quot;progress-slider&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;0&quot; step=&quot;0.1&quot; oninput=&quot;onSliderInput()&quot; style=&quot;width: 100%;&quot;&gt;
        &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;toast&quot; id=&quot;toast&quot;&gt;&lt;/div&gt;

    &lt;script&gt;
        // 初始化数据收集SDK
        let sdk = null;
        try {
            sdk = new MuskCollect();
        } catch(e) {
            console.warn('数据收集SDK初始化失败，将使用本地存储模式', e);
        }

        // 核心动态物理模型
        const SCALE = 50; // 1cm = 50px
        const MIN_DIAMETER_CM = 1.0;
        const MAX_DIAMETER_CM = 5.0;
        const START_X = 200; // 原点 X (尺子0刻度)
        const START_Y = 550; // 尺子上边缘 Y
        
        // 状态管理
        let state = {
            mode: 'rolling', // 'rolling' or 'wrapping'
            currentTab: 'rolling',
            progress: 0,     // 0.0 to 1.0 (1.0 = 一圈)
            isPlaying: false,
            radiusCm: 0.5,    // 默认直径 1cm，范围 1-5cm (半径 0.5-2.5cm)
            experimentData: [], // 实验数据
            chartConnected: false // 是否已点击连接数据点
        };

        // 衍生变量
        let R, C, CY;
        
        function updatePhysics() {
            R = state.radiusCm * SCALE;
            C = 2 * Math.PI * R;
            CY = START_Y - R;
        }
        updatePhysics(); // 初始化

        let animFrameId = null;

        // 初始化尺子刻度
        function initRuler() {
            const rulerGroup = document.getElementById('ruler-ticks');
            rulerGroup.innerHTML = ''; // 清空
            // 绘制 0 到 20 cm
            for (let i = 0; i &lt;= 200; i++) {
                const x = START_X + i * (SCALE / 10); 
                const isCm = i % 10 === 0;
                const isHalfCm = i % 5 === 0 &amp;&amp; !isCm;
                
                let y2 = START_Y + 10;
                if (isHalfCm) y2 = START_Y + 18;
                if (isCm) y2 = START_Y + 28;

                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x);
                line.setAttribute('y1', START_Y);
                line.setAttribute('x2', x);
                line.setAttribute('y2', y2);
                line.setAttribute('stroke', '#5c4b37');
                line.setAttribute('stroke-width', isCm ? '2' : '1');
                rulerGroup.appendChild(line);

                if (isCm) {
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', x);
                    text.setAttribute('y', START_Y + 45);
                    text.setAttribute('text-anchor', 'middle');
                    text.setAttribute('font-size', '16');
                    text.setAttribute('font-weight', 'bold');
                    text.setAttribute('fill', '#2c3e50');
                    text.textContent = i / 10;
                    rulerGroup.appendChild(text);
                }
            }
            // 单位标注
            const unit = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            unit.setAttribute('x', START_X + 16);
            unit.setAttribute('y', START_Y + 45);
            unit.setAttribute('font-size', '14');
            unit.setAttribute('fill', '#2c3e50');
            unit.textContent = 'cm';
            rulerGroup.appendChild(unit);
        }

        // ================= Tab切换 =================
        function switchTab(tab) {
            state.currentTab = tab;
            
            // 更新tab样式
            document.querySelectorAll('.tab').forEach(t =&gt; t.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');

            // 隐藏所有面板
            document.getElementById('canvas').style.display = 'none';
            document.getElementById('info-panel').style.display = 'none';
            document.getElementById('layer-experiment').style.display = 'none';
            document.getElementById('layer-analysis').style.display = 'none';
            document.getElementById('controls-bar').style.display = 'none';
            const dragHint = document.getElementById('drag-hint');
            if (dragHint) dragHint.style.display = 'none';
            const recordBtn = document.getElementById('record-btn');
            if (recordBtn) recordBtn.style.display = 'none';

            if (tab === 'rolling' || tab === 'wrapping') {
                // 测量方法页面
                document.getElementById('canvas').style.display = 'block';
                document.getElementById('info-panel').style.display = 'block';
                document.getElementById('controls-bar').style.display = 'flex';
                const dragHint = document.getElementById('drag-hint');
                if (dragHint) dragHint.style.display = 'inline';
                const recordBtn = document.getElementById('record-btn');
                if (recordBtn) recordBtn.style.display = 'flex';
                switchMethod(tab);
            } else if (tab === 'experiment') {
                // 实验记录页面
                document.getElementById('layer-experiment').style.display = 'block';
                document.getElementById('main-title').innerHTML = '环节三：实验记录';
                renderRadiusCircumferenceChart();
            } else if (tab === 'analysis') {
                // 数据分析页面
                document.getElementById('layer-analysis').style.display = 'block';
                document.getElementById('main-title').innerHTML = '环节四：数据分析';
                loadAndRenderAnalysis();
            }
        }

        // ================= 交互事件：拖拽逻辑 =================
        const dragHitbox = document.getElementById('drag-hitbox');
        const svg = document.getElementById('canvas');
        let isDragging = false;

        function getMouseX(e) {
            const CTM = svg.getScreenCTM();
            const clientX = e.touches &amp;&amp; e.touches.length &gt; 0 ? e.touches[0].clientX : e.clientX;
            return (clientX - CTM.e) / CTM.a;
        }

        function startDrag(e) {
            isDragging = true;
            state.isPlaying = false;
            updatePlayBtnUI();
            dragHitbox.style.cursor = 'grabbing';
            handleDrag(e);
        }

        function handleDrag(e) {
            if (!isDragging) return;
            e.preventDefault();
            const mouseX = getMouseX(e);
            let rawProgress = (mouseX - START_X) / C;
            state.progress = Math.max(0, Math.min(1, rawProgress));
            render();
        }

        function endDrag() {
            isDragging = false;
            dragHitbox.style.cursor = 'grab';
        }

        dragHitbox.addEventListener('mousedown', startDrag);
        dragHitbox.addEventListener('touchstart', startDrag, {passive: false});
        window.addEventListener('mousemove', handleDrag);
        window.addEventListener('touchmove', handleDrag, {passive: false});
        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);

        // ================= 交互事件：UI控制 =================
        function switchMethod(method) {
            state.mode = method;
            document.getElementById('main-title').innerHTML = 
                (method === 'rolling' ? '圆的周长测量（滚动法）' : '圆的周长测量（绕线法）') +
                '&lt;span class=&quot;drag-hint&quot; id=&quot;drag-hint&quot;&gt;👉 提示：可直接在屏幕上左右拖拽圆或绳子&lt;/span&gt;';
            
            document.getElementById('layer-rolling').style.display = method === 'rolling' ? 'block' : 'none';
            document.getElementById('layer-wrapping').style.display = method === 'wrapping' ? 'block' : 'none';
            
            render();
        }

        function onDiameterChange() {
            const rawDiameter = parseFloat(document.getElementById('diameter-slider').value);
            const diameter = Number.isFinite(rawDiameter)
                ? Math.max(MIN_DIAMETER_CM, Math.min(MAX_DIAMETER_CM, rawDiameter))
                : MIN_DIAMETER_CM;
            state.radiusCm = diameter / 2;
            updatePhysics();
            document.getElementById('info-d').innerText = `${diameter.toFixed(2)} cm（r=${state.radiusCm.toFixed(2)} cm）`;
            if(state.progress &gt; 1) state.progress = 1;
            render();
        }

        function onSliderInput() {
            state.isPlaying = false;
            updatePlayBtnUI();
            const val = parseFloat(document.getElementById('progress-slider').value);
            state.progress = val / 100;
            render();
        }

        function togglePlay() {
            if (state.progress &gt;= 1 &amp;&amp; !state.isPlaying) {
                state.progress = 0; 
            }
            state.isPlaying = !state.isPlaying;
            updatePlayBtnUI();
            
            if (state.isPlaying) {
                lastTime = performance.now();
                animFrameId = requestAnimationFrame(loop);
            } else {
                cancelAnimationFrame(animFrameId);
            }
        }

        function resetAnimation() {
            state.isPlaying = false;
            state.progress = 0;
            updatePlayBtnUI();
            render();
        }

        function updatePlayBtnUI() {
            const text = document.getElementById('play-text');
            const icon = document.getElementById('icon-play');
            if (state.isPlaying) {
                text.innerText = '暂停演示';
                icon.innerHTML = '&lt;rect x=&quot;6&quot; y=&quot;4&quot; width=&quot;4&quot; height=&quot;16&quot;&gt;&lt;/rect&gt;&lt;rect x=&quot;14&quot; y=&quot;4&quot; width=&quot;4&quot; height=&quot;16&quot;&gt;&lt;/rect&gt;';
            } else {
                text.innerText = state.progress &gt;= 1 ? '重新演示' : '自动演示';
                icon.innerHTML = '&lt;polygon points=&quot;5 3 19 12 5 21 5 3&quot;&gt;&lt;/polygon&gt;';
            }
        }

        let lastTime = 0;
        const DURATION = 3500;
        function loop(timestamp) {
            if (!state.isPlaying) return;
            const delta = timestamp - lastTime;
            lastTime = timestamp;
            
            state.progress += delta / DURATION;
            if (state.progress &gt;= 1) {
                state.progress = 1;
                state.isPlaying = false;
                updatePlayBtnUI();
            }
            render();
            
            if (state.isPlaying) {
                animFrameId = requestAnimationFrame(loop);
            }
        }

        // ================= 核心渲染引擎 =================
        function render() {
            document.getElementById('progress-slider').value = state.progress * 100;
            
            const currentLength = state.progress * C;
            const currentX = START_X + currentLength;
            
            const realLengthCm = (currentLength / SCALE).toFixed(2);
            document.getElementById('info-length').innerText = `${realLengthCm} cm`;
            document.getElementById('info-turns').innerText = state.progress.toFixed(2) + ' 圈';

            const angleRad = state.progress * 2 * Math.PI;
            const angleDeg = state.progress * 360;

            if (state.mode === 'rolling') {
                document.getElementById('rolling-circle-group').setAttribute('transform', `translate(200, ${CY})`);
                document.getElementById('rolling-circle-shape').setAttribute('r', R);
                document.getElementById('rolling-radius-line').setAttribute('y2', R);
                
                const rotator = document.getElementById('rolling-circle-rotator');
                rotator.setAttribute('transform', `translate(${currentLength}, 0) rotate(${angleDeg})`);
                document.getElementById('rolling-measure-line').setAttribute('x2', currentX);
                
                let tracePath = `M ${START_X} ${START_Y} `;
                const steps = Math.floor(state.progress * 60);
                for (let i = 1; i &lt;= steps; i++) {
                    const p = i / 60 * state.progress;
                    const aRad = p * 2 * Math.PI;
                    const cx = START_X + p * C;
                    const px = cx - R * Math.sin(aRad);
                    const py = CY + R * Math.cos(aRad);
                    tracePath += `L ${px} ${py} `;
                }
                const currentAx = currentX - R * Math.sin(angleRad);
                const currentAy = CY + R * Math.cos(angleRad);
                tracePath += `L ${currentAx} ${currentAy}`;
                document.getElementById('rolling-trace').setAttribute('d', state.progress &gt; 0.01 ? tracePath : '');
                document.getElementById('rolling-point-a').setAttribute('transform', `translate(${currentAx}, ${currentAy})`);

            } else {
                document.getElementById('wrapping-center-group').setAttribute('transform', `translate(200, ${CY})`);
                document.getElementById('wrapping-circle-shape').setAttribute('r', R);
                document.getElementById('wrapping-cross-1').setAttribute('x1', -R*0.8);
                document.getElementById('wrapping-cross-1').setAttribute('x2', R*0.8);
                document.getElementById('wrapping-cross-2').setAttribute('y1', -R*0.8);
                document.getElementById('wrapping-cross-2').setAttribute('y2', R*0.8);
                
                document.getElementById('wrapping-spool-rotator').setAttribute('transform', `rotate(${-angleDeg})`);
                document.getElementById('wrapping-measure-line').setAttribute('x2', currentX);
                document.getElementById('wrapping-point-a').setAttribute('transform', `translate(${currentX}, ${START_Y})`);
                
                const arcPath = document.getElementById('wrapping-arc');
                if (state.progress &gt;= 0.999) {
                    arcPath.setAttribute('d', ''); 
                } else if (state.progress &lt;= 0) {
                    // 初始状态：绳子完全绕在圆上，不显示多余圆弧
                    arcPath.setAttribute('d', '');
                } else {
                    const endAngle = Math.PI / 2 + (1 - state.progress) * 2 * Math.PI;
                    const ex = START_X + R * Math.cos(endAngle);
                    const ey = CY + R * Math.sin(endAngle);
                    const largeArcFlag = (1 - state.progress) &gt; 0.5 ? 1 : 0;
                    arcPath.setAttribute('d', `M ${START_X} ${START_Y} A ${R} ${R} 0 ${largeArcFlag} 1 ${ex} ${ey}`);
                }
            }
        }

        // ================= 实验记录功能 =================
        function addDataRow(d, c) {
            const tbody = document.getElementById('data-tbody');
            const rowIndex = tbody.children.length + 1;
            const diameter = d || '';
            const circumference = c || '';
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                &lt;td&gt;${rowIndex}&lt;/td&gt;
                &lt;td&gt;&lt;input type=&quot;number&quot; step=&quot;0.01&quot; min=&quot;0.1&quot; max=&quot;5&quot; value=&quot;${diameter}&quot; style=&quot;width: 100px; text-align: center;&quot; oninput=&quot;updateRatio(this)&quot;&gt;&lt;/td&gt;
                &lt;td&gt;&lt;input type=&quot;number&quot; step=&quot;0.01&quot; min=&quot;0.1&quot; max=&quot;20&quot; value=&quot;${circumference}&quot; style=&quot;width: 100px; text-align: center;&quot; oninput=&quot;updateRatio(this)&quot;&gt;&lt;/td&gt;
                &lt;td class=&quot;ratio-cell&quot;&gt;--&lt;/td&gt;
                &lt;td&gt;&lt;button class=&quot;delete-row-btn&quot; onclick=&quot;deleteRow(this)&quot;&gt;&times;&lt;/button&gt;&lt;/td&gt;
            `;
            tbody.appendChild(tr);
            
            updateRowNumbers();
            state.chartConnected = false;
            renderRadiusCircumferenceChart();
        }

        function deleteRow(btn) {
            const tr = btn.closest('tr');
            tr.remove();
            updateRowNumbers();
            state.chartConnected = false;
            renderRadiusCircumferenceChart();
        }

        function updateRowNumbers() {
            const rows = document.querySelectorAll('#data-tbody tr');
            rows.forEach((row, idx) =&gt; {
                row.cells[0].textContent = idx + 1;
            });
        }

        function updateRatio(input) {
            const tr = input.closest('tr');
            const d = parseFloat(tr.cells[1].querySelector('input').value);
            const c = parseFloat(tr.cells[2].querySelector('input').value);
            const ratioCell = tr.cells[3];
            
            if (!isNaN(d) &amp;&amp; !isNaN(c) &amp;&amp; d &gt; 0) {
                ratioCell.textContent = (c / d).toFixed(3);
            } else {
                ratioCell.textContent = '--';
            }
            state.chartConnected = false;
            renderRadiusCircumferenceChart();
        }

        function renderRadiusCircumferenceChart() {
            const canvas = document.getElementById('radius-circumference-chart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            ctx.clearRect(0, 0, width, height);

            const points = Array.from(document.querySelectorAll('#data-tbody tr')).map(row =&gt; {
                const d = parseFloat(row.cells[1].querySelector('input').value);
                const c = parseFloat(row.cells[2].querySelector('input').value);
                return { radius: d / 2, circumference: c };
            }).filter(point =&gt; Number.isFinite(point.radius) &amp;&amp; Number.isFinite(point.circumference) &amp;&amp; point.radius &gt; 0 &amp;&amp; point.circumference &gt; 0);

            const padding = { top: 28, right: 24, bottom: 56, left: 62 };
            const chartWidth = width - padding.left - padding.right;
            const chartHeight = height - padding.top - padding.bottom;
            const maxRadius = Math.max(2.5, ...points.map(point =&gt; point.radius)) * 1.15;
            const maxCircumference = Math.max(16, ...points.map(point =&gt; point.circumference), 2 * Math.PI * maxRadius) * 1.05;
            const xFor = radius =&gt; padding.left + (radius / maxRadius) * chartWidth;
            const yFor = circumference =&gt; height - padding.bottom - (circumference / maxCircumference) * chartHeight;

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);
            ctx.strokeStyle = '#cbd5e0';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(padding.left, padding.top);
            ctx.lineTo(padding.left, height - padding.bottom);
            ctx.lineTo(width - padding.right, height - padding.bottom);
            ctx.stroke();

            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1;
            ctx.fillStyle = '#4a5568';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            for (let i = 0; i &lt;= 5; i++) {
                const radius = maxRadius * i / 5;
                const x = xFor(radius);
                ctx.beginPath();
                ctx.moveTo(x, padding.top);
                ctx.lineTo(x, height - padding.bottom);
                ctx.stroke();
                ctx.fillText(radius.toFixed(1), x, height - padding.bottom + 20);
            }

            ctx.textAlign = 'right';
            for (let i = 0; i &lt;= 5; i++) {
                const circumference = maxCircumference * i / 5;
                const y = yFor(circumference);
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(width - padding.right, y);
                ctx.stroke();
                ctx.fillText(circumference.toFixed(1), padding.left - 10, y + 4);
            }

            ctx.fillStyle = '#2d3748';
            ctx.font = 'bold 13px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('半径 r（cm）', padding.left + chartWidth / 2, height - 14);
            ctx.save();
            ctx.translate(16, padding.top + chartHeight / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.fillText('周长 C（cm）', 0, 0);
            ctx.restore();

            if (points.length === 0) {
                const connectBtn = document.getElementById('connect-chart-btn');
                const status = document.getElementById('relation-chart-status');
                if (connectBtn) connectBtn.style.display = 'none';
                if (status) status.textContent = '填写数据后显示散点';
                return;
            }

            if (points.length &gt;= 2 &amp;&amp; state.chartConnected) {
                const sortedPoints = [...points].sort((a, b) =&gt; a.radius - b.radius);
                ctx.strokeStyle = '#ff4d4f';
                ctx.lineWidth = 2.5;
                ctx.setLineDash([]);
                ctx.beginPath();
                ctx.moveTo(xFor(0), yFor(0));
                sortedPoints.forEach(point =&gt; {
                    const x = xFor(point.radius);
                    const y = yFor(point.circumference);
                    ctx.lineTo(x, y);
                });
                ctx.stroke();
            }

            points.forEach(point =&gt; {
                const x = xFor(point.radius);
                const y = yFor(point.circumference);
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 77, 79, 0.78)';
                ctx.fill();
                ctx.strokeStyle = '#c53030';
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            const connectBtn = document.getElementById('connect-chart-btn');
            const status = document.getElementById('relation-chart-status');
            if (connectBtn) connectBtn.style.display = points.length &gt;= 2 ? 'inline-flex' : 'none';
            if (status) status.textContent = state.chartConnected &amp;&amp; points.length &gt;= 2 ? '已连接数据点' : (points.length &gt;= 2 ? '已有多个点，点击按钮连线' : '已显示数据点');
        }

        function connectChartPoints() {
            const validPointCount = Array.from(document.querySelectorAll('#data-tbody tr')).filter(row =&gt; {
                const d = parseFloat(row.cells[1].querySelector('input').value);
                const c = parseFloat(row.cells[2].querySelector('input').value);
                return Number.isFinite(d) &amp;&amp; Number.isFinite(c) &amp;&amp; d &gt; 0 &amp;&amp; c &gt; 0;
            }).length;
            if (validPointCount &lt; 2) return;
            state.chartConnected = true;
            renderRadiusCircumferenceChart();
        }

        function recordCurrentData() {
            switchTab('experiment');
            
            const currentD = (state.radiusCm * 2);
            const currentC = (state.progress * C / SCALE);
            
            if (state.progress &lt; 0.99) {
                showToast('请先将圆滚动完一整圈再记录数据哦');
                return;
            }
            
            addDataRow(currentD.toFixed(2), currentC.toFixed(2));
            showToast('已记录当前测量数据，可继续调整直径测量下一组');
            
            setTimeout(() =&gt; {
                const rows = document.querySelectorAll('#data-tbody tr');
                const lastRow = rows[rows.length - 1];
                updateRatio(lastRow.querySelector('input'));
            }, 100);
        }

        async function submitExperiment() {
            const name = document.getElementById('student-name').value.trim();
            const className = document.getElementById('student-class').value.trim();
            const rows = document.querySelectorAll('#data-tbody tr');
            
            if (!name) {
                showToast('请输入你的姓名');
                return;
            }
            if (!className) {
                showToast('请输入你的班级');
                return;
            }
            if (rows.length &lt; 3) {
                showToast('请至少记录3组测量数据');
                return;
            }

            const dataList = [];
            let hasError = false;
            rows.forEach(row =&gt; {
                const d = parseFloat(row.cells[1].querySelector('input').value);
                const c = parseFloat(row.cells[2].querySelector('input').value);
                if (isNaN(d) || isNaN(c) || d &lt;= 0 || c &lt;= 0) {
                    hasError = true;
                    return;
                }
                dataList.push({
                    diameter: d,
                    circumference: c,
                    ratio: +(c / d).toFixed(3)
                });
            });

            if (hasError) {
                showToast('请填写完整所有数据，且数值必须大于0');
                return;
            }

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '提交中...';

            try {
                if (sdk) {
                    await sdk.save('circle_measurements', {
                        studentName: name,
                        studentClass: className,
                        measurements: dataList,
                        submittedAt: Date.now()
                    });
                } else {
                    const localData = JSON.parse(localStorage.getItem('circle_measurements') || '[]');
                    localData.push({
                        studentName: name,
                        studentClass: className,
                        measurements: dataList,
                        submittedAt: Date.now()
                    });
                    localStorage.setItem('circle_measurements', JSON.stringify(localData));
                }
                
                showToast('提交成功！正在跳转到数据分析页面');
                setTimeout(() =&gt; {

            }
        }

        // ================= 数据分析功能 =================
        async function loadAndRenderAnalysis() {
            let allData = [];
            
            try {
                if (sdk) {
                    const records = await sdk.query('circle_measurements');
                    records.forEach(record =&gt; {
                        record.data.measurements.forEach(m =&gt; {
                            allData.push({
                                ...m,
                                studentName: record.data.studentName,
                                studentClass: record.data.studentClass
                            });
                        });
                    });
                } else {
                    const localData = JSON.parse(localStorage.getItem('circle_measurements') || '[]');
                    localData.forEach(record =&gt; {
                        record.measurements.forEach(m =&gt; {
                            allData.push({
                                ...m,
                                studentName: record.studentName,
                                studentClass: record.studentClass
                            });
                        });
                    });
                }
            } catch(e) {
                console.error('加载数据失败', e);
            }

            renderScatterChart(allData);
            updateStats(allData);
        }

        function renderScatterChart(data) {
            const canvas = document.getElementById('scatter-chart');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            
            ctx.clearRect(0, 0, width, height);
            
            if (data.length === 0) {
                ctx.fillStyle = '#a0aec0';
                ctx.font = '18px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('暂无数据，请先完成实验并提交数据', width/2, height/2);
                return;
            }

            const padding = {top: 30, right: 30, bottom: 50, left: 60};
            const chartWidth = width - padding.left - padding.right;
            const chartHeight = height - padding.top - padding.bottom;
            
            const maxD = Math.max(...data.map(d =&gt; d.diameter)) * 1.2;
            const maxC = Math.max(...data.map(d =&gt; d.circumference)) * 1.2;
            
            ctx.strokeStyle = '#4a5568';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(padding.left, padding.top);
            ctx.lineTo(padding.left, height - padding.bottom);
            ctx.lineTo(width - padding.right, height - padding.bottom);
            ctx.stroke();

            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1;
            ctx.fillStyle = '#4a5568';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';

            for (let i = 0; i &lt;= 5; i++) {
                const x = padding.left + (chartWidth / 5) * i;
                const val = (maxD / 5 * i).toFixed(1);
                ctx.beginPath();
                ctx.moveTo(x, padding.top);
                ctx.lineTo(x, height - padding.bottom);
                ctx.stroke();
                ctx.fillText(val + 'cm', x, height - padding.bottom + 20);
            }

            ctx.textAlign = 'right';
            for (let i = 0; i &lt;= 5; i++) {
                const y = height - padding.bottom - (chartHeight / 5) * i;
                const val = (maxC / 5 * i).toFixed(1);
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(width - padding.right, y);
                ctx.stroke();
                ctx.fillText(val + 'cm', padding.left - 10, y + 4);
            }

            ctx.fillStyle = '#2d3748';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('直径 d (cm)', width/2, height - 10);
            
            ctx.save();
            ctx.translate(15, height/2);
            ctx.rotate(-Math.PI/2);
            ctx.fillText('周长 C (cm)', 0, 0);
            ctx.restore();

            ctx.strokeStyle = '#4285f4';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            const x0 = padding.left;
            const y0 = height - padding.bottom;
            const x1 = padding.left + chartWidth;
            const y1 = height - padding.bottom - (Math.PI * maxD / maxC) * chartHeight;
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.fillStyle = '#4285f4';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('C = &pi;d 理论直线', x1 - 100, y1 + 20);

            data.forEach((point, idx) =&gt; {
                const x = padding.left + (point.diameter / maxD) * chartWidth;
                const y = height - padding.bottom - (point.circumference / maxC) * chartHeight;
                
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 77, 79, 0.7)';
                ctx.fill();
                ctx.strokeStyle = '#c53030';
                ctx.lineWidth = 2;
                ctx.stroke();
            });
        }

        function updateStats(data) {
            const countEl = document.getElementById('stat-count');
            const avgEl = document.getElementById('stat-avg');
            const errorEl = document.getElementById('stat-error');

            countEl.textContent = data.length;

            if (data.length === 0) {
                avgEl.textContent = '--';
                errorEl.textContent = '--';
                return;
            }

            const ratios = data.map(d =&gt; d.ratio);
            const avgRatio = ratios.reduce((a, b) =&gt; a + b, 0) / ratios.length;
            const avgError = Math.abs(avgRatio - Math.PI) / Math.PI * 100;

            avgEl.textContent = avgRatio.toFixed(3);
            errorEl.textContent = avgError.toFixed(1) + '%';
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() =&gt; {
                toast.classList.remove('show');
            }, 2500);
        }

        // 初始渲染
        initRuler();
        render();
        addDataRow(); // 默认添加一行

        window.addEventListener('resize', () =&gt; {
            render();
            renderRadiusCircumferenceChart();
            if (state.currentTab === 'analysis') {
                loadAndRenderAnalysis();
            }
        });
    &lt;/script&gt;
