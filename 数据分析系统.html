<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📊 数据分析系统</title>

    <!-- ========== 外部库 ========== -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js">
    </script>

    <style>
        /* ========== 全局重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #f4f7fb;
            padding: 24px;
            min-height: 100vh;
            color: #1e293b;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #e9edf2;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #b0c4de;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a9c9;
        }

        .app-container {
            max-width: 1440px;
            margin: 0 auto;
        }

        /* ========== 头部 ========== */
        .app-header {
            background: linear-gradient(135deg, #1e3a5f, #2a5f7a);
            color: #fff;
            padding: 24px 36px;
            border-radius: 20px;
            margin-bottom: 28px;
            box-shadow: 0 8px 30px rgba(30, 58, 95, 0.25);
        }
        .app-header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        /* ========== 上传区域 ========== */
        .upload-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 28px;
        }
        @media (max-width: 820px) {
            .upload-grid {
                grid-template-columns: 1fr;
            }
        }

        .upload-zone {
            background: #fff;
            border-radius: 18px;
            padding: 32px 28px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            border: 2px dashed #dce3ed;
            transition: all 0.25s;
            cursor: pointer;
            text-align: center;
            position: relative;
        }
        .upload-zone:hover,
        .upload-zone.dragover {
            border-color: #2a5f7a;
            background: #f8faff;
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(42, 95, 122, 0.08);
        }
        .upload-zone .icon-big {
            font-size: 52px;
            display: block;
            margin-bottom: 10px;
        }
        .upload-zone h3 {
            font-size: 18px;
            font-weight: 600;
            color: #1e293b;
        }
        .upload-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }
        .upload-zone .or-divider {
            margin: 14px 0 8px;
            color: #94a3b8;
            font-size: 13px;
        }
        .upload-zone .camera-btn {
            background: #eef2f6;
            border: none;
            padding: 8px 22px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            color: #1e293b;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            position: relative;
            z-index: 10;
        }
        .upload-zone .camera-btn:hover {
            background: #dce3ed;
        }
        .upload-zone .camera-btn:active {
            transform: scale(0.96);
        }

        /* ========== 数据预览区域 ========== */
        .preview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 28px;
        }
        @media (max-width: 1024px) {
            .preview-grid {
                grid-template-columns: 1fr;
            }
        }

        .data-preview {
            background: #fff;
            border-radius: 18px;
            padding: 20px 24px 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
        }
        .data-preview .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .data-preview .header-row h2 {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .data-preview .header-row .info-text {
            font-size: 13px;
            color: #64748b;
        }
        .data-preview .table-wrap {
            overflow-x: auto;
            max-height: 280px;
            overflow-y: auto;
            border-radius: 12px;
            border: 1px solid #edf2f7;
        }
        .data-preview table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 300px;
        }
        .data-preview table th {
            background: #f1f5f9;
            color: #1e293b;
            font-weight: 600;
            padding: 10px 14px;
            text-align: left;
            position: sticky;
            top: 0;
            z-index: 2;
            border-bottom: 2px solid #e2e8f0;
        }
        .data-preview table td {
            padding: 8px 14px;
            border-bottom: 1px solid #f1f5f9;
            color: #1e293b;
        }
        .data-preview table tr:hover td {
            background: #f8fafc;
        }
        .data-preview .empty-msg {
            padding: 40px 20px;
            text-align: center;
            color: #94a3b8;
            font-size: 15px;
        }

        /* ========== 统计表 ========== */
        .stats-table-wrap {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #edf2f7;
        }
        .stats-table-wrap table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .stats-table-wrap table th {
            background: #f1f5f9;
            color: #1e293b;
            font-weight: 600;
            padding: 10px 14px;
            text-align: left;
            border-bottom: 2px solid #e2e8f0;
        }
        .stats-table-wrap table td {
            padding: 10px 14px;
            border-bottom: 1px solid #f1f5f9;
            color: #1e293b;
        }
        .stats-table-wrap table tr:hover td {
            background: #f8fafc;
        }
        .stats-table-wrap .stat-row .label-cell {
            font-weight: 500;
            color: #475569;
        }
        .stats-table-wrap .stat-row .value-cell {
            font-weight: 600;
            color: #0f172a;
        }
        .stats-table-wrap .stat-row .badge-cell .trend-badge {
            display: inline-block;
            padding: 2px 14px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 600;
        }
        .trend-badge.stable {
            background: #dcfce7;
            color: #166534;
        }
        .trend-badge.unstable {
            background: #fee2e2;
            color: #991b1b;
        }
        .trend-badge.moderate {
            background: #fef9c3;
            color: #854d0e;
        }
        .stats-table-wrap .empty-msg {
            padding: 40px 20px;
            text-align: center;
            color: #94a3b8;
            font-size: 15px;
        }

        /* ========== 图表 + 统计卡片 ========== */
        .analytics-grid {
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            gap: 24px;
            margin-bottom: 28px;
        }
        @media (max-width: 1024px) {
            .analytics-grid {
                grid-template-columns: 1fr;
            }
        }

        .chart-card {
            background: #fff;
            border-radius: 18px;
            padding: 20px 24px 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
        }
        .chart-card .chart-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px 24px;
            margin-bottom: 16px;
        }
        .chart-card .chart-controls .col-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chart-card .chart-controls .col-selector select {
            padding: 8px 18px;
            border-radius: 100px;
            border: 1px solid #dce3ed;
            background: #fff;
            font-size: 14px;
            font-weight: 500;
            color: #1e293b;
            outline: none;
            cursor: pointer;
            transition: 0.2s;
            min-width: 140px;
        }
        .chart-card .chart-controls .col-selector select:focus {
            border-color: #2a5f7a;
            box-shadow: 0 0 0 3px rgba(42, 95, 122, 0.12);
        }
        .chart-card .chart-controls .col-selector select[multiple] {
            min-height: 80px;
            border-radius: 12px;
            padding: 6px 10px;
        }
        .chart-card .chart-type-checkboxes {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 20px;
        }
        .chart-card .chart-type-checkboxes label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 500;
            color: #334155;
            cursor: pointer;
        }
        .chart-card .chart-type-checkboxes input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #2a5f7a;
            cursor: pointer;
        }

        .chart-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 8px;
        }
        .chart-container .chart-box {
            flex: 1 1 calc(50% - 10px);
            min-width: 280px;
            position: relative;
            height: 280px;
            background: #fafcfe;
            border-radius: 12px;
            padding: 8px;
            border: 1px solid #edf2f7;
        }
        .chart-container .chart-box canvas {
            width: 100% !important;
            height: 100% !important;
        }
        @media (max-width: 640px) {
            .chart-container .chart-box {
                flex: 1 1 100%;
            }
        }
        .chart-container .empty-chart-msg {
            width: 100%;
            text-align: center;
            color: #94a3b8;
            padding: 40px 0;
            font-size: 15px;
        }

        .stats-card {
            background: #fff;
            border-radius: 18px;
            padding: 20px 24px 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
        }
        .stats-card h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .stats-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            flex: 1;
        }
        .stat-item {
            background: #f8fafc;
            border-radius: 14px;
            padding: 12px 14px;
            border: 1px solid #edf2f7;
            transition: 0.2s;
            flex: 0 0 calc(33.33% - 10px);
            min-width: 100px;
            box-sizing: border-box;
        }
        .stat-item:hover {
            border-color: #dce3ed;
            background: #f1f5f9;
        }
        .stat-item .label {
            font-size: 11px;
            font-weight: 500;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .stat-item .value {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            margin-top: 2px;
            word-break: break-all;
        }
        .stat-item.full-width {
            flex: 0 0 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 18px;
        }
        .stat-item.full-width .label {
            font-size: 13px;
            text-transform: none;
        }
        .stat-item.full-width .value {
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        @media (max-width: 640px) {
            .stat-item {
                flex: 0 0 calc(50% - 10px);
            }
            .stat-item.full-width {
                flex: 0 0 100%;
            }
        }

        /* ========== 预测卡片 ========== */
        .predict-card {
            background: #fff;
            border-radius: 18px;
            padding: 20px 24px 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            margin-top: 28px;
        }
        .predict-card .predict-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 14px;
        }
        .predict-card .predict-header h2 {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .predict-card .predict-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .predict-card .predict-controls input {
            width: 80px;
            padding: 6px 12px;
            border-radius: 100px;
            border: 1px solid #dce3ed;
            font-size: 14px;
            text-align: center;
            outline: none;
        }
        .predict-card .predict-controls input:focus {
            border-color: #2a5f7a;
            box-shadow: 0 0 0 3px rgba(42, 95, 122, 0.1);
        }
        .predict-card .predict-controls button {
            padding: 6px 22px;
            border-radius: 100px;
            border: none;
            background: #1e3a5f;
            color: #fff;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .predict-card .predict-controls button:hover {
            background: #2a5f7a;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(30, 58, 95, 0.25);
        }
        .predict-result {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 32px;
            padding: 14px 18px;
            background: #f8fafc;
            border-radius: 14px;
            border: 1px solid #edf2f7;
            min-height: 50px;
            align-items: center;
        }
        .predict-result .pred-item {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .predict-result .pred-item .pred-label {
            font-size: 13px;
            color: #64748b;
        }
        .predict-result .pred-item .pred-value {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
        }
        .predict-result .pred-empty {
            color: #94a3b8;
            font-size: 14px;
        }

        /* ========== 相机模态框 ========== */
        .camera-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .camera-modal.active {
            display: flex;
        }
        .camera-modal video {
            max-width: 90%;
            max-height: 70vh;
            border-radius: 16px;
            background: #000;
            border: 2px solid #fff;
        }
        .camera-modal .cam-controls {
            margin-top: 20px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .camera-modal .cam-controls button {
            padding: 12px 32px;
            border-radius: 100px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .camera-modal .cam-controls .capture-btn {
            background: #e74c3c;
            color: #fff;
        }
        .camera-modal .cam-controls .capture-btn:hover {
            background: #c0392b;
            transform: scale(1.05);
        }
        .camera-modal .cam-controls .close-cam-btn {
            background: #95a5a6;
            color: #fff;
        }
        .camera-modal .cam-controls .close-cam-btn:hover {
            background: #7f8c8d;
        }
        .camera-modal .cam-controls .switch-btn {
            background: #3498db;
            color: #fff;
        }
        .camera-modal .cam-controls .switch-btn:hover {
            background: #2980b9;
        }

        /* ========== 动画 ========== */
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .fade-in {
            animation: fadeSlideUp 0.4s ease forwards;
        }
    </style>
</head>
<body>
    <div class="app-container">

        <!-- ====== 相机模态框 ====== -->
        <div class="camera-modal" id="cameraModal">
            <video id="videoElement" autoplay playsinline></video>
            <div class="cam-controls">
                <button class="switch-btn" id="switchCameraBtn">🔄 切换摄像头</button>
                <button class="capture-btn" id="captureBtn">📸 拍照</button>
                <button class="close-cam-btn" id="closeCameraBtn">✕ 关闭</button>
            </div>
        </div>

        <!-- ====== 头部 ====== -->
        <header class="app-header">
            <h1>📊 数据分析系统</h1>
        </header>

        <!-- ====== 上传区域 ====== -->
        <div class="upload-grid">
            <div class="upload-zone" id="dropZone">
                <span class="icon-big">📁</span>
                <h3>拖拽或点击上传数据</h3>
                <input type="file" id="fileInput" multiple />
                <div class="or-divider">—— 或 ——</div>
                <button class="camera-btn" id="cameraBtn">📷 拍照上传</button>
            </div>

            <!-- 数据概览 -->
            <div style="background:#fff;border-radius:18px;padding:24px 28px;box-shadow:0 4px 16px rgba(0,0,0,0.04);display:flex;flex-direction:column;justify-content:center;">
                <div style="display:flex;align-items:center;gap:16px;margin-bottom:12px;">
                    <span style="font-size:40px;">📋</span>
                    <div>
                        <div style="font-size:20px;font-weight:600;">数据就绪状态</div>
                        <div style="font-size:14px;color:#64748b;" id="statusText">等待导入数据…</div>
                    </div>
                </div>
                <div style="display:flex;gap:20px;flex-wrap:wrap;margin-top:6px;">
                    <div><span style="font-weight:500;">行数</span> <span id="rowCount" style="color:#2a5f7a;font-weight:600;">0</span></div>
                    <div><span style="font-weight:500;">列数</span> <span id="colCount" style="color:#2a5f7a;font-weight:600;">0</span></div>
                    <div><span style="font-weight:500;">数值列</span> <span id="numCols" style="color:#2a5f7a;font-weight:600;">0</span></div>
                </div>
            </div>
        </div>

        <!-- ====== 数据预览 + 统计表 ====== -->
        <div class="preview-grid">
            <div class="data-preview">
                <div class="header-row">
                    <h2>📄 数据预览 <span class="info-text" id="fileNameDisplay"></span></h2>
                    <span style="font-size:13px;color:#94a3b8;">点击单元格可编辑</span>
                </div>
                <div class="table-wrap" id="tableWrap">
                    <div class="empty-msg">暂无数据，请上传文件</div>
                </div>
            </div>

            <div class="data-preview">
                <div class="header-row">
                    <h2>📊 统计表</h2>
                    <span style="font-size:13px;color:#94a3b8;">基于当前所选数据列</span>
                </div>
                <div class="stats-table-wrap" id="statsTableWrap">
                    <div class="empty-msg">请选择数据列</div>
                </div>
            </div>
        </div>

        <!-- ====== 图表 + 统计卡片 ====== -->
        <div class="analytics-grid">
            <div class="chart-card">
                <div class="chart-controls">
                    <div class="col-selector">
                        <label for="chartColSelect">📊 主数据列</label>
                        <select id="chartColSelect">
                            <option value="">— 请先导入数据 —</option>
                        </select>
                    </div>
                    <div class="col-selector">
                        <label for="compareColSelect">📊 对比列（复式）</label>
                        <select id="compareColSelect" multiple>
                            <option value="">— 可选多列 —</option>
                        </select>
                    </div>
                    <div class="chart-type-checkboxes">
                        <label><input type="checkbox" value="bar" checked /> 📊 条形图</label>
                        <label><input type="checkbox" value="pie" checked /> 🍩 扇形图</label>
                        <label><input type="checkbox" value="line" checked /> 📈 折线图</label>
                    </div>
                </div>
                <div class="chart-container" id="chartContainer"></div>
            </div>

            <div class="stats-card">
                <h2>📐 详细统计</h2>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="label">📈 最大值</div>
                        <div class="value" id="statMax">—</div>
                    </div>
                    <div class="stat-item">
                        <div class="label">📉 最小值</div>
                        <div class="value" id="statMin">—</div>
                    </div>
                    <div class="stat-item">
                        <div class="label">📏 极差</div>
                        <div class="value" id="statRange">—</div>
                    </div>
                    <div class="stat-item">
                        <div class="label">📌 平均数</div>
                        <div class="value" id="statMean">—</div>
                    </div>
                    <div class="stat-item">
                        <div class="label">📊 方差</div>
                        <div class="value" id="statVariance">—</div>
                    </div>
                    <div class="stat-item">
                        <div class="label">📊 标准差</div>
                        <div class="value" id="statStd">—</div>
                    </div>
                    <div class="stat-item full-width">
                        <span class="label">⚖️ 稳定性评估</span>
                        <span class="value" id="statStability">—</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ====== 预测卡片 ====== -->
        <div class="predict-card">
            <div class="predict-header">
                <h2>🔮 数据预测</h2>
                <div class="predict-controls">
                    <label for="predictSteps" style="font-size:14px;font-weight:500;">预测步数</label>
                    <input type="number" id="predictSteps" value="5" min="1" max="20" />
                    <button id="predictBtn">🚀 预测</button>
                </div>
            </div>
            <div class="predict-result" id="predictResult">
                <span class="pred-empty">选择数据列后点击「预测」生成</span>
            </div>
        </div>

    </div>

    <!-- ============================================================ -->
    <!-- ======================== JavaScript =========================== -->
    <!-- ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ---------- DOM 引用 ----------
            const dropZone = document.getElementById('dropZone');
            const fileInput = document.getElementById('fileInput');
            const cameraBtn = document.getElementById('cameraBtn');
            const tableWrap = document.getElementById('tableWrap');
            const fileNameDisplay = document.getElementById('fileNameDisplay');
            const statusText = document.getElementById('statusText');
            const rowCount = document.getElementById('rowCount');
            const colCount = document.getElementById('colCount');
            const numCols = document.getElementById('numCols');

            const chartColSelect = document.getElementById('chartColSelect');
            const compareColSelect = document.getElementById('compareColSelect');
            const chartTypeCheckboxes = document.querySelectorAll('.chart-type-checkboxes input[type="checkbox"]');
            const chartContainer = document.getElementById('chartContainer');

            const statsTableWrap = document.getElementById('statsTableWrap');

            const statMean = document.getElementById('statMean');
            const statVariance = document.getElementById('statVariance');
            const statStd = document.getElementById('statStd');
            const statStability = document.getElementById('statStability');
            const statMax = document.getElementById('statMax');
            const statMin = document.getElementById('statMin');
            const statRange = document.getElementById('statRange');

            const predictSteps = document.getElementById('predictSteps');
            const predictBtn = document.getElementById('predictBtn');
            const predictResult = document.getElementById('predictResult');

            // ---------- 相机相关 ----------
            const cameraModal = document.getElementById('cameraModal');
            const videoElement = document.getElementById('videoElement');
            const captureBtn = document.getElementById('captureBtn');
            const closeCameraBtn = document.getElementById('closeCameraBtn');
            const switchCameraBtn = document.getElementById('switchCameraBtn');

            let stream = null;
            let facingMode = 'environment';

            // ---------- 全局状态 ----------
            let rawData = [];
            let numericCols = [];
            let chartInstances = {};

            // ---------- 工具函数 ----------
            function isNumeric(v) {
                return v !== null && v !== undefined && v !== '' && !isNaN(parseFloat(v)) && isFinite(v);
            }

            function toNum(v) {
                return parseFloat(v);
            }

            function detectNumericCols(data, threshold = 0.6) {
                if (!data || data.length < 2) return [];
                const rows = data.slice(1);
                const colCount = data[0].length;
                const result = [];
                for (let c = 0; c < colCount; c++) {
                    let numericCount = 0;
                    let sample = 0;
                    for (let r = 0; r < Math.min(rows.length, 20); r++) {
                        const val = rows[r]?.[c];
                        if (isNumeric(val)) numericCount++;
                        sample++;
                    }
                    const ratio = sample > 0 ? numericCount / sample : 0;
                    if (ratio >= threshold) result.push(c);
                }
                return result;
            }

            function getColData(data, colIdx) {
                const values = [];
                for (let r = 1; r < data.length; r++) {
                    const v = data[r]?.[colIdx];
                    if (isNumeric(v)) values.push(toNum(v));
                }
                return values;
            }

            function getColDataWithLabels(data, colIdx) {
                const result = [];
                for (let r = 1; r < data.length; r++) {
                    const v = data[r]?.[colIdx];
                    if (isNumeric(v)) {
                        const label = data[r]?.[0] !== undefined && data[r]?.[0] !== '' ? String(data[r][0]) : `#${r}`;
                        result.push({ label, value: toNum(v) });
                    }
                }
                return result;
            }

            function getHeader(data) {
                return data.length > 0 ? data[0] : [];
            }

            function calcStats(values) {
                if (!values || values.length < 2) return null;
                const n = values.length;
                const sorted = [...values].sort((a, b) => a - b);
                const min = sorted[0];
                const max = sorted[sorted.length - 1];
                const range = max - min;
                const sum = values.reduce((a, b) => a + b, 0);
                const mean = sum / n;
                const squaredDiffs = values.map(v => (v - mean) ** 2);
                const variance = squaredDiffs.reduce((a, b) => a + b, 0) / n;
                const std = Math.sqrt(variance);
                const cv = mean !== 0 ? std / Math.abs(mean) : Infinity;
                let stability = '';
                let stabilityClass = '';
                if (cv < 0.1) { stability = '✅ 稳定 (CV < 0.1)';
                    stabilityClass = 'stable'; } else if (cv < 0.25) { stability = '⚠️ 中等波动 (CV < 0.25)';
                    stabilityClass = 'moderate'; } else { stability = '❌ 波动较大 (CV ≥ 0.25)';
                    stabilityClass = 'unstable'; }
                return { n, sum, mean, variance, std, cv, stability, stabilityClass, min, max, range };
            }

            function linearRegressionPredict(values, steps) {
                if (!values || values.length < 2 || steps < 1) return null;
                const n = values.length;
                const indices = Array.from({ length: n }, (_, i) => i + 1);
                const sumX = indices.reduce((a, b) => a + b, 0);
                const sumY = values.reduce((a, b) => a + b, 0);
                const sumXY = indices.reduce((a, b, i) => a + b * values[i], 0);
                const sumX2 = indices.reduce((a, b) => a + b * b, 0);
                const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
                const intercept = (sumY - slope * sumX) / n;
                const predictions = [];
                for (let i = 1; i <= steps; i++) {
                    const nextX = n + i;
                    predictions.push(slope * nextX + intercept);
                }
                return { slope, intercept, predictions };
            }

            // ---------- 渲染数据表格 ----------
            function renderTable(data) {
                tableWrap.innerHTML = '';
                if (!data || data.length < 2) {
                    tableWrap.innerHTML = '<div class="empty-msg">暂无数据，请上传文件</div>';
                    return;
                }
                const table = document.createElement('table');
                const thead = document.createElement('thead');
                const tbody = document.createElement('tbody');
                const header = data[0];
                let trHead = document.createElement('tr');
                header.forEach(h => {
                    const th = document.createElement('th');
                    th.textContent = h !== undefined && h !== null && h !== '' ? String(h) : '列' + (header.indexOf(h) +
                    1);
                    trHead.appendChild(th);
                });
                thead.appendChild(trHead);
                const maxRows = Math.min(data.length - 1, 50);
                for (let r = 0; r < maxRows; r++) {
                    const row = data[r + 1];
                    const tr = document.createElement('tr');
                    row.forEach((cell, ci) => {
                        const td = document.createElement('td');
                        td.textContent = cell !== undefined && cell !== null ? String(cell) : '';
                        td.contentEditable = true;
                        td.dataset.row = r + 1;
                        td.dataset.col = ci;
                        td.addEventListener('blur', function() {
                            const newVal = this.textContent.trim();
                            const ri = parseInt(this.dataset.row);
                            const ci2 = parseInt(this.dataset.col);
                            if (!isNaN(ri) && !isNaN(ci2) && rawData[ri]) {
                                rawData[ri][ci2] = newVal;
                                refreshAfterDataChange();
                            }
                        });
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                }
                if (data.length - 1 > maxRows) {
                    const tr = document.createElement('tr');
                    const td = document.createElement('td');
                    td.colSpan = header.length;
                    td.textContent = `... 还有 ${data.length - 1 - maxRows} 行`;
                    td.style.textAlign = 'center';
                    td.style.color = '#94a3b8';
                    td.style.fontStyle = 'italic';
                    tr.appendChild(td);
                    tbody.appendChild(tr);
                }
                table.appendChild(thead);
                table.appendChild(tbody);
                tableWrap.appendChild(table);
            }

            // ---------- 渲染统计表 ----------
            function renderStatsTable(stats) {
                statsTableWrap.innerHTML = '';
                if (!stats) {
                    statsTableWrap.innerHTML = '<div class="empty-msg">请选择数据列</div>';
                    return;
                }
                const table = document.createElement('table');
                const tbody = document.createElement('tbody');

                const rows = [
                    { label: '📈 最大值', value: stats.max.toFixed(4) },
                    { label: '📉 最小值', value: stats.min.toFixed(4) },
                    { label: '📏 极差', value: stats.range.toFixed(4) },
                    { label: '📌 平均数', value: stats.mean.toFixed(4) },
                    { label: '📊 方差', value: stats.variance.toFixed(4) },
                    { label: '📊 标准差', value: stats.std.toFixed(4) },
                    { label: '⚖️ 稳定性', value: stats.stability, isBadge: true, badgeClass: stats.stabilityClass },
                ];

                rows.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.className = 'stat-row';
                    const tdLabel = document.createElement('td');
                    tdLabel.className = 'label-cell';
                    tdLabel.textContent = row.label;
                    const tdValue = document.createElement('td');
                    tdValue.className = 'value-cell';
                    if (row.isBadge) {
                        const badge = document.createElement('span');
                        badge.className = `trend-badge ${row.badgeClass}`;
                        badge.textContent = row.value;
                        tdValue.appendChild(badge);
                    } else {
                        tdValue.textContent = row.value;
                    }
                    tr.appendChild(tdLabel);
                    tr.appendChild(tdValue);
                    tbody.appendChild(tr);
                });

                table.appendChild(tbody);
                statsTableWrap.appendChild(table);
            }

            // ---------- 更新状态 ----------
            function updateStatus(data) {
                if (!data || data.length < 2) {
                    statusText.textContent = '等待导入数据…';
                    rowCount.textContent = '0';
                    colCount.textContent = '0';
                    numCols.textContent = '0';
                    return;
                }
                const rows = data.length - 1;
                const cols = data[0].length;
                const numColsIdx = detectNumericCols(data);
                statusText.textContent = `✅ 已加载 ${rows} 行 × ${cols} 列`;
                rowCount.textContent = rows;
                colCount.textContent = cols;
                numCols.textContent = numColsIdx.length;
            }

            // ---------- 列选择器 ----------
            function populateColumnSelector(data) {
                chartColSelect.innerHTML = '';
                compareColSelect.innerHTML = '';
                if (!data || data.length < 2) {
                    chartColSelect.innerHTML = '<option value="">— 请先导入数据 —</option>';
                    compareColSelect.innerHTML = '<option value="">— 可选多列 —</option>';
                    return;
                }
                const header = data[0];
                const numIdx = detectNumericCols(data);
                let hasNumeric = false;
                numIdx.forEach(idx => {
                    const label = header[idx] !== undefined && header[idx] !== '' ? String(header[idx]) : '列' + (idx +
                    1);
                    const opt = document.createElement('option');
                    opt.value = idx;
                    opt.textContent = `📊 ${label}`;
                    chartColSelect.appendChild(opt);
                    const opt2 = document.createElement('option');
                    opt2.value = idx;
                    opt2.textContent = `📊 ${label}`;
                    compareColSelect.appendChild(opt2);
                    hasNumeric = true;
                });
                if (!hasNumeric) {
                    chartColSelect.innerHTML = '<option value="">⚠️ 未检测到数值列</option>';
                    compareColSelect.innerHTML = '<option value="">⚠️ 未检测到数值列</option>';
                }
                if (chartColSelect.options.length > 0) {
                    chartColSelect.selectedIndex = 0;
                }
            }

            // ---------- 数据变更后刷新 ----------
            function refreshAfterDataChange() {
                if (!rawData || rawData.length < 2) {
                    renderTable(rawData);
                    updateStatus(rawData);
                    populateColumnSelector(rawData);
                    updateChartsAndStats();
                    renderStatsTable(null);
                    return;
                }
                numericCols = detectNumericCols(rawData);
                renderTable(rawData);
                updateStatus(rawData);
                populateColumnSelector(rawData);
                updateChartsAndStats();
            }

            // ---------- 获取对比数据 ----------
            function getCompareData(data, colIdx, baseLabels) {
                const result = [];
                let count = 0;
                for (let r = 1; r < data.length && count < baseLabels.length; r++) {
                    const v = data[r]?.[colIdx];
                    if (isNumeric(v)) {
                        result.push(toNum(v));
                        count++;
                    } else {
                        result.push(null);
                        count++;
                    }
                }
                return result;
            }

            // ---------- 更新图表和统计 ----------
            function updateChartsAndStats() {
                const colIdx = parseInt(chartColSelect.value);
                const selectedTypes = [];
                chartTypeCheckboxes.forEach(cb => {
                    if (cb.checked) selectedTypes.push(cb.value);
                });

                chartContainer.innerHTML = '';

                const statsIds = ['statMean', 'statVariance', 'statStd', 'statMax', 'statMin', 'statRange'];
                statsIds.forEach(id => document.getElementById(id).textContent = '—');
                statStability.textContent = '—';
                statStability.className = '';

                renderStatsTable(null);

                if (!rawData || rawData.length < 2 || isNaN(colIdx) || selectedTypes.length === 0) {
                    const msg = document.createElement('div');
                    msg.className = 'empty-chart-msg';
                    msg.textContent = selectedTypes.length === 0 ? '请至少选择一种图表类型' : '请导入数据并选择数值列';
                    chartContainer.appendChild(msg);
                    Object.values(chartInstances).forEach(chart => chart.destroy());
                    chartInstances = {};
                    return;
                }

                const mainData = getColDataWithLabels(rawData, colIdx);
                if (mainData.length < 2) {
                    const msg = document.createElement('div');
                    msg.className = 'empty-chart-msg';
                    msg.textContent = '该列数值不足，无法生成图表';
                    chartContainer.appendChild(msg);
                    Object.values(chartInstances).forEach(chart => chart.destroy());
                    chartInstances = {};
                    renderStatsTable(null);
                    return;
                }

                const mainValues = mainData.map(d => d.value);
                const mainLabels = mainData.map(d => d.label);

                // 统计
                const stats = calcStats(mainValues);
                if (stats) {
                    statMean.textContent = stats.mean.toFixed(4);
                    statVariance.textContent = stats.variance.toFixed(4);
                    statStd.textContent = stats.std.toFixed(4);
                    statMax.textContent = stats.max.toFixed(4);
                    statMin.textContent = stats.min.toFixed(4);
                    statRange.textContent = stats.range.toFixed(4);
                    const badge = document.createElement('span');
                    badge.className = `trend-badge ${stats.stabilityClass}`;
                    badge.textContent = stats.stability;
                    statStability.innerHTML = '';
                    statStability.appendChild(badge);
                    renderStatsTable(stats);
                }

                const header = getHeader(rawData);
                const colLabel = header[colIdx] !== undefined && header[colIdx] !== '' ? String(header[colIdx]) : '列' + (
                    colIdx + 1);

                // 获取对比列
                const compareOptions = compareColSelect.selectedOptions;
                const compareCols = [];
                for (let opt of compareOptions) {
                    const val = parseInt(opt.value);
                    if (!isNaN(val) && val !== colIdx) {
                        compareCols.push(val);
                    }
                }

                const colors = [
                    '#2a5f7a', '#4a8db7', '#6ab0d6', '#94c5e0', '#b8d9ed',
                    '#f7a072', '#f5c27b', '#a8c686', '#7fb3a5', '#c9a7b0'
                ];

                const chartTypesConfig = {
                    bar: { label: '条形图', type: 'bar' },
                    pie: { label: '扇形图', type: 'pie' },
                    line: { label: '折线图', type: 'line' }
                };

                Object.values(chartInstances).forEach(chart => chart.destroy());
                chartInstances = {};

                selectedTypes.forEach((typeKey, index) => {
                    const box = document.createElement('div');
                    box.className = 'chart-box';
                    const canvas = document.createElement('canvas');
                    canvas.id = `chart-${typeKey}-${Date.now()}-${index}`;
                    box.appendChild(canvas);
                    chartContainer.appendChild(box);

                    const ctx = canvas.getContext('2d');
                    let chartData = {};
                    let chartOptions = {};

                    const config = chartTypesConfig[typeKey];
                    if (!config) return;

                    // 扇形图不支持复式
                    if (typeKey === 'pie') {
                        chartData = {
                            labels: mainLabels,
                            datasets: [{
                                data: mainValues,
                                backgroundColor: mainValues.map((_, i) => colors[i % colors.length]),
                                borderColor: '#fff',
                                borderWidth: 2,
                            }]
                        };
                        chartOptions = {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: true, position: 'right' },
                                tooltip: { callbacks: { label: ctx => {
                                        const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
                                        const pct = total > 0 ? ((ctx.parsed / total) * 100).toFixed(1) : 0;
                                        return `${ctx.label}: ${ctx.parsed} (${pct}%)`;
                                    } } }
                            }
                        };
                    } else {
                        // 条形图和折线图支持复式
                        const datasets = [];
                        const colorSet = [
                            { bg: 'rgba(42, 95, 122, 0.75)', border: '#1e3a5f' },
                            { bg: 'rgba(247, 160, 114, 0.75)', border: '#d97747' },
                            { bg: 'rgba(168, 198, 134, 0.75)', border: '#7b9f6a' },
                            { bg: 'rgba(180, 140, 200, 0.75)', border: '#9b7fb0' },
                            { bg: 'rgba(100, 180, 210, 0.75)', border: '#3a8aaa' },
                        ];

                        // 主数据集
                        datasets.push({
                            label: colLabel,
                            data: mainValues,
                            backgroundColor: colorSet[0].bg,
                            borderColor: colorSet[0].border,
                            borderWidth: 2,
                            borderRadius: typeKey === 'bar' ? 4 : 0,
                            fill: typeKey === 'line',
                            tension: typeKey === 'line' ? 0.3 : 0,
                            pointBackgroundColor: typeKey === 'line' ? mainValues.map((_, i) => colors[i % colors
                                .length]) : undefined,
                            pointRadius: typeKey === 'line' ? 5 : undefined,
                            pointHoverRadius: typeKey === 'line' ? 7 : undefined,
                        });

                        // 对比数据集
                        compareCols.forEach((cIdx, ci) => {
                            const cLabel = header[cIdx] !== undefined && header[cIdx] !== '' ? String(header[
                                cIdx]) : '列' + (cIdx + 1);
                            const cData = getCompareData(rawData, cIdx, mainLabels);
                            const ci2 = (ci + 1) % colorSet.length;
                            datasets.push({
                                label: cLabel,
                                data: cData,
                                backgroundColor: colorSet[ci2].bg,
                                borderColor: colorSet[ci2].border,
                                borderWidth: 2,
                                borderRadius: typeKey === 'bar' ? 4 : 0,
                                fill: typeKey === 'line',
                                tension: typeKey === 'line' ? 0.3 : 0,
                                pointBackgroundColor: typeKey === 'line' ? cData.map((_, i) => colors[(i +
                                    ci2) % colors.length]) : undefined,
                                pointRadius: typeKey === 'line' ? 5 : undefined,
                                pointHoverRadius: typeKey === 'line' ? 7 : undefined,
                            });
                        });

                        chartData = {
                            labels: mainLabels,
                            datasets: datasets
                        };

                        chartOptions = {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: true, position: 'top' },
                                tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y !== undefined ? ctx.parsed.y : '无数据'}` } }
                            },
                            scales: {
                                y: { beginAtZero: true, grid: { color: '#f1f5f9' } },
                                x: { grid: { display: false } }
                            }
                        };
                    }

                    const chart = new Chart(ctx, {
                        type: typeKey,
                        data: chartData,
                        options: chartOptions
                    });
                    chartInstances[typeKey] = chart;
                });

                chartInstances._currentValues = mainValues;
                chartInstances._currentColLabel = colLabel;
            }

            // ---------- 预测 ----------
            function runPrediction() {
                const colIdx = parseInt(chartColSelect.value);
                if (!rawData || rawData.length < 2 || isNaN(colIdx)) {
                    predictResult.innerHTML = '<span class="pred-empty">⚠️ 请先导入数据并选择数值列</span>';
                    return;
                }
                const values = getColData(rawData, colIdx);
                if (values.length < 2) {
                    predictResult.innerHTML = '<span class="pred-empty">⚠️ 该列数值不足，无法预测</span>';
                    return;
                }
                const steps = parseInt(predictSteps.value) || 5;
                if (steps < 1) {
                    predictResult.innerHTML = '<span class="pred-empty">⚠️ 预测步数至少为1</span>';
                    return;
                }
                const result = linearRegressionPredict(values, steps);
                if (!result) {
                    predictResult.innerHTML = '<span class="pred-empty">⚠️ 预测失败，请检查数据</span>';
                    return;
                }
                const header = getHeader(rawData);
                const colLabel = header[colIdx] !== undefined && header[colIdx] !== '' ? String(header[colIdx]) : '列' + (
                    colIdx + 1);

                let html = `<span style="font-weight:500;color:#1e293b;">📈 ${colLabel} 未来 ${steps} 步预测</span>`;
                html += `<span style="color:#64748b;font-size:13px;margin-left:8px;">(趋势斜率 ${result.slope.toFixed(4)})</span>`;
                html += `<div style="display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:4px;">`;
                result.predictions.forEach((p, i) => {
                    html +=
                        `<span class="pred-item"><span class="pred-label">步${i+1}</span><span class="pred-value">${p.toFixed(4)}</span></span>`;
                });
                html += `</div>`;
                predictResult.innerHTML = html;
            }

            // ---------- 相机功能 ----------
            async function startCamera(facing = 'environment') {
                try {
                    if (stream) {
                        stream.getTracks().forEach(track => track.stop());
                    }
                    const constraints = {
                        video: {
                            facingMode: facing,
                            width: { ideal: 1920 },
                            height: { ideal: 1080 }
                        },
                        audio: false
                    };
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                    videoElement.srcObject = stream;
                    await videoElement.play();
                    return true;
                } catch (err) {
                    console.error('摄像头启动失败:', err);
                    alert('无法访问摄像头，请检查权限设置或连接摄像头。');
                    return false;
                }
            }

            function stopCamera() {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                    stream = null;
                }
                videoElement.srcObject = null;
            }

            function openCamera() {
                cameraModal.classList.add('active');
                startCamera(facingMode);
            }

            function closeCamera() {
                cameraModal.classList.remove('active');
                stopCamera();
            }

            function capturePhoto() {
                if (!stream) return;
                const canvas = document.createElement('canvas');
                const video = videoElement;
                canvas.width = video.videoWidth || 1280;
                canvas.height = video.videoHeight || 720;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                canvas.toBlob(async function(blob) {
                    if (!blob) return;
                    const file = new File([blob], `photo_${Date.now()}.jpg`, { type: 'image/jpeg' });
                    await parseFile(file);
                    closeCamera();
                }, 'image/jpeg', 0.92);
            }

            // ---------- 解析文件 ----------
            async function parseFile(file) {
                const ext = file.name.split('.').pop().toLowerCase();
                let parsedData = null;
                let fileName = file.name;

                try {
                    if (['xlsx', 'xls'].includes(ext)) {
                        const buf = await file.arrayBuffer();
                        const workbook = XLSX.read(buf, { type: 'array' });
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        const json = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
                        if (json && json.length > 0) parsedData = json;
                    } else if (ext === 'csv') {
                        const text = await file.text();
                        const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
                        parsedData = lines.map(line => line.split(',').map(cell => cell.trim()));
                    } else if (ext === 'txt') {
                        const text = await file.text();
                        const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
                        let sep = ',';
                        if (lines[0] && lines[0].includes('\t')) sep = '\t';
                        else if (lines[0] && lines[0].includes(';')) sep = ';';
                        else if (lines[0] && lines[0].includes('|')) sep = '|';
                        parsedData = lines.map(line => line.split(sep).map(cell => cell.trim()));
                    } else if (ext === 'docx') {
                        const buf = await file.arrayBuffer();
                        const result = await mammoth.extractRawText({ arrayBuffer: buf });
                        const text = result.value;
                        const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
                        if (lines.length > 0) {
                            let sep = ',';
                            const sample = lines[0];
                            if (sample.includes('\t')) sep = '\t';
                            else if (sample.includes(';')) sep = ';';
                            else if (sample.includes('|')) sep = '|';
                            else if (sample.includes(',')) sep = ',';
                            else sep = ' ';
                            parsedData = lines.map(line => line.split(sep).map(cell => cell.trim()));
                        }
                    } else if (ext === 'pptx') {
                        const text = await file.text();
                        const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
                        if (lines.length > 0) {
                            let sep = ',';
                            const sample = lines[0];
                            if (sample.includes('\t')) sep = '\t';
                            else if (sample.includes(';')) sep = ';';
                            else if (sample.includes('|')) sep = '|';
                            else if (sample.includes(',')) sep = ',';
                            else sep = ' ';
                            parsedData = lines.map(line => line.split(sep).map(cell => cell.trim()));
                        }
                        if (!parsedData || parsedData.length < 2) {
                            alert('PPT文件解析可能不完整，请尝试另存为Excel或CSV格式后导入。');
                        }
                    } else if (['png', 'jpg', 'jpeg', 'bmp', 'gif', 'webp'].includes(ext)) {
                        const imgUrl = URL.createObjectURL(file);
                        const result = await Tesseract.recognize(imgUrl, 'chi_sim+eng', {
                            logger: m => { if (m.status === 'recognizing text') console.log(m); }
                        });
                        URL.revokeObjectURL(imgUrl);
                        const text = result.data.text;
                        const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
                        if (lines.length > 0) {
                            let sep = ',';
                            const sample = lines[0];
                            if (sample.includes('\t')) sep = '\t';
                            else if (sample.includes(';')) sep = ';';
                            else if (sample.includes('|')) sep = '|';
                            else if (sample.includes(',')) sep = ',';
                            else sep = ' ';
                            parsedData = lines.map(line => line.split(sep).map(cell => cell.trim()));
                        }
                        if (!parsedData || parsedData.length < 2) {
                            alert('OCR识别未提取到有效表格数据，请确保图片包含清晰的表格或数值。');
                        }
                    } else {
                        alert('不支持的文件格式: ' + ext);
                        return;
                    }
                } catch (err) {
                    console.error('解析错误:', err);
                    alert('文件解析失败: ' + err.message);
                    return;
                }

                if (parsedData && parsedData.length > 0) {
                    const maxCols = parsedData.reduce((max, row) => Math.max(max, row.length), 0);
                    parsedData = parsedData.map(row => {
                        while (row.length < maxCols) row.push('');
                        return row;
                    });
                    rawData = parsedData;
                    fileNameDisplay.textContent = `📎 ${fileName}`;
                    refreshAfterDataChange();
                } else {
                    alert('未能从文件中提取有效数据，请检查文件内容格式。');
                }
            }

            // ---------- 事件绑定 ----------
            // 文件上传
            fileInput.addEventListener('change', function(e) {
                if (this.files.length > 0) {
                    parseFile(this.files[0]);
                }
                this.value = '';
            });

            // 拖拽
            dropZone.addEventListener('dragover', function(e) {
                e.preventDefault();
                this.classList.add('dragover');
            });
            dropZone.addEventListener('dragleave', function(e) {
                e.preventDefault();
                this.classList.remove('dragover');
            });
            dropZone.addEventListener('drop', function(e) {
                e.preventDefault();
                this.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    parseFile(files[0]);
                }
            });

            // 点击上传区域
            dropZone.addEventListener('click', function(e) {
                if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
                    fileInput.click();
                }
            });

            // 拍照按钮 - 打开摄像头
            cameraBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                e.preventDefault();
                openCamera();
            });

            // 相机控制
            captureBtn.addEventListener('click', capturePhoto);

            closeCameraBtn.addEventListener('click', closeCamera);

            switchCameraBtn.addEventListener('click', function() {
                facingMode = facingMode === 'environment' ? 'user' : 'environment';
                startCamera(facingMode);
            });

            // 点击模态框背景关闭
            cameraModal.addEventListener('click', function(e) {
                if (e.target === this) closeCamera();
            });

            // ESC 关闭
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeCamera();
            });

            // 图表控制
            chartTypeCheckboxes.forEach(cb => {
                cb.addEventListener('change', updateChartsAndStats);
            });
            chartColSelect.addEventListener('change', updateChartsAndStats);
            compareColSelect.addEventListener('change', updateChartsAndStats);

            // 预测
            predictBtn.addEventListener('click', runPrediction);

            // ---------- 初始化 ----------
            refreshAfterDataChange();

            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    Object.values(chartInstances).forEach(chart => chart.resize());
                }, 200);
            });

            window.__app = { rawData, refreshAfterDataChange, updateChartsAndStats, runPrediction };

            console.log('📊 数据分析系统已启动！拍照功能已修复（电脑打开摄像头）。');

        })();
    </script>
</body>
</html>
