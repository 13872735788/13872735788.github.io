<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双人答题对战｜哪吒 vs 敖丙</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pptxtojson@0.5.2/dist/pptxtojson.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }
        body {
            background: linear-gradient(120deg, #0f0c29, #1a1a4e, #24243e);
            padding: 20px;
            color: #ffffff;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            margin-bottom: 12px;
            color: #ffdd55;
            letter-spacing: 2px;
            font-size: 28px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        .control-bar {
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-base {
            padding: 12px 22px;
            font-size: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: #fff;
            font-weight: 500;
            transition: all 0.3s;
        }
        .btn-base:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        .all-file-btn {
            background: linear-gradient(135deg, #36d399, #22c55e);
        }
        .camera-btn {
            background: #409eff;
        }
        .file-hidden {
            display: none;
        }
        .total-time-box {
            text-align: center;
            font-size: 26px;
            color: #fff350;
            margin: 10px 0 24px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 243, 80, 0.2);
        }
        .game-container {
            display: flex;
            gap: 26px;
            max-width: 1420px;
            margin: 0 auto;
        }
        .player-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 26px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            min-height: 660px;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        .player-card:hover {
            border-color: rgba(255, 255, 255, 0.3);
        }
        .left-card {
            border-color: #ff6b35;
            background: rgba(255, 107, 53, 0.08);
        }
        .right-card {
            border-color: #00b4d8;
            background: rgba(0, 180, 216, 0.08);
        }
        .player-info {
            text-align: center;
            margin-bottom: 22px;
        }
        .avatar-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 12px;
            border-radius: 50%;
            overflow: visible;
        }
        .avatar-wrapper .avatar-ring {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            padding: 4px;
            background: conic-gradient(from 0deg, #ff6b35, #ffd700, #ff6b35);
            animation: spinRing 4s linear infinite;
        }
        .avatar-wrapper .avatar-ring.right-ring {
            background: conic-gradient(from 0deg, #00b4d8, #7b68ee, #00b4d8);
        }
        @keyframes spinRing {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        .avatar-wrapper .avatar-inner {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #fff;
            background: #1a1a2e;
        }
        .avatar-wrapper .avatar-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .avatar-wrapper .role-tag {
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            padding: 2px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .role-tag.neZha {
            color: #ff6b35;
            border-color: #ff6b35;
        }
        .role-tag.aobing {
            color: #00b4d8;
            border-color: #00b4d8;
        }
        .avatar-wrapper .deco {
            position: absolute;
            font-size: 28px;
            opacity: 0.6;
            animation: floatDeco 3s ease-in-out infinite;
        }
        .deco.deco-left {
            top: -10px;
            right: -15px;
            animation-delay: 0s;
        }
        .deco.deco-right {
            bottom: -10px;
            left: -15px;
            animation-delay: 1.5s;
        }
        @keyframes floatDeco {
            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-6px) rotate(10deg);
            }
        }
        .btn-group {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 8px 0;
        }
        .upload-btn,
        .camera-btn-sm {
            padding: 5px 12px;
            font-size: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            transition: all 0.3s;
        }
        .upload-btn:hover,
        .camera-btn-sm:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .score-text {
            font-size: 24px;
            margin-top: 8px;
            font-weight: bold;
        }
        .score-text .score-num {
            color: #ffdd55;
            font-size: 28px;
        }
        .single-timer {
            text-align: center;
            font-size: 24px;
            color: #ffe872;
            margin: 16px 0;
        }
        .question-area {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 24px;
            min-height: 190px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .empty-hint {
            text-align: center;
            font-size: 20px;
            color: #cccccc;
            padding: 40px 0;
        }
        .question-text {
            font-size: 20px;
            line-height: 1.65;
            margin-bottom: 24px;
            color: #f0f0f0;
        }
        .type-tag {
            display: inline-block;
            font-size: 14px;
            padding: 3px 12px;
            border-radius: 20px;
            margin-bottom: 10px;
            background: #ff9600;
            color: #fff;
        }
        .option-grid-four {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .option-grid-two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .option-item {
            padding: 15px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 17px;
            text-align: center;
            border: 2px solid transparent;
        }
        .option-item:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: #ffdd55;
            transform: scale(1.02);
        }
        .option-item:active {
            transform: scale(0.95);
        }
        .tip-popup {
            position: fixed;
            font-size: 80px;
            font-weight: bold;
            display: none;
            z-index: 99;
            text-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }
        .left-correct {
            left: 18%;
            top: 42%;
            color: #4cd964;
        }
        .left-wrong {
            left: 18%;
            top: 42%;
            color: #ff3a30;
        }
        .right-correct {
            right: 18%;
            top: 42%;
            color: #4cd964;
        }
        .right-wrong {
            right: 18%;
            top: 42%;
            color: #ff3a30;
        }
        .bottom-btn-wrap {
            text-align: center;
            margin-top: 32px;
        }
        #restartBtn {
            padding: 14px 44px;
            font-size: 20px;
            background: linear-gradient(135deg, #ff6b35, #ff4500);
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 4px 20px rgba(255, 69, 0, 0.3);
        }
        #restartBtn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(255, 69, 0, 0.5);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }
        .modal-box {
            background: linear-gradient(145deg, #1e1e3f, #2a2a5e);
            padding: 28px;
            border-radius: 20px;
            width: 95%;
            max-width: 750px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .modal h3 {
            margin-bottom: 16px;
            color: #ffdd55;
        }
        #editTextArea {
            width: 100%;
            height: 320px;
            padding: 12px;
            font-size: 15px;
            color: #222;
            white-space: pre-wrap;
            margin-bottom: 16px;
            border-radius: 8px;
            outline: none;
            resize: vertical;
            background: #f5f5f5;
        }
        .modal-desc {
            color: #ccc;
            font-size: 13px;
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .modal-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .modal-btns button {
            padding: 8px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.3s;
        }
        .modal-btns button:hover {
            transform: translateY(-2px);
        }
        .confirm-import {
            background: #28c76f;
            color: #fff;
        }
        .close-modal {
            background: #ff4d4f;
            color: #fff;
        }

        #cameraModal .camera-box {
            text-align: center;
        }
        #cameraVideo {
            width: 320px;
            height: 320px;
            object-fit: cover;
            border-radius: 12px;
            transform: scaleX(-1);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        #cameraCanvas {
            display: none;
        }
        .camera-ctrl {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .take-btn {
            background: #28c76f;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .confirm-btn {
            background: #409eff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: none;
        }
        .close-camera {
            background: #ff4d4f;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .music-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 50;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            color: #fff;
            font-size: 22px;
        }
        .music-control:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }
        .music-control.muted {
            opacity: 0.5;
        }
        @media (max-width: 900px) {
            .game-container {
                flex-direction: column;
            }
            .tip-popup {
                font-size: 50px;
            }
            .left-correct,
            .left-wrong {
                left: 10%;
                top: 50%;
            }
            .right-correct,
            .right-wrong {
                right: 10%;
                top: 50%;
            }
            .avatar-wrapper {
                width: 90px;
                height: 90px;
            }
            .deco {
                font-size: 20px !important;
            }
        }
        @media (max-width: 600px) {
            .option-grid-four,
            .option-grid-two {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .option-item {
                padding: 10px;
                font-size: 14px;
            }
            .question-text {
                font-size: 16px;
            }
            .player-card {
                padding: 16px;
            }
            #cameraVideo {
                width: 280px;
                height: 280px;
            }
        }
    </style>
</head>
<body>
    <!-- 背景音乐 - 欢快积极正能量 -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
    </audio>
    <div class="music-control" id="musicToggle" title="切换音乐">
        <i class="fas fa-volume-up" id="musicIcon"></i>
    </div>

    <h1>⚔️ 双人答题对战</h1>

    <div class="control-bar">
        <input type="file" id="allFileInput" class="file-hidden" accept=".txt,.docx,.xlsx,.pptx,.jpg,.jpeg,.png,.bmp">
        <button class="btn-base all-file-btn" onclick="document.getElementById('allFileInput').click()">📂 上传题库（PPT/Excel/Word/TXT/图片）</button>
        <button class="btn-base camera-btn" onclick="openCameraOCR()">📷 现场拍照扫题</button>
    </div>

    <div class="total-time-box">⏱️ 整场剩余时间：<span id="totalCount">90</span> 秒</div>

    <div class="game-container">
        <div class="player-card left-card">
            <div class="player-info">
                <div class="avatar-wrapper">
                    <div class="avatar-ring"></div>
                    <div class="avatar-inner">
                        <img id="avatarLeft" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMDAgMjAwIj48Y2lyY2xlIGN4PSIxMDAiIGN5PSI5MCIgcj0iNzAiIGZpbGw9IiNmZmJjNDAiLz48Y2lyY2xlIGN4PSI3MCIgY3k9Ijc1IiByPSI4IiBmaWxsPSIjMjIyIi8+PGNpcmNsZSBjeD0iMTMwIiBjeT0iNzUiIHI9IjgiIGZpbGw9IiMyMjIiLz48cGF0aCBkPSJNNzUgMTEwYzUgMTUgMjAgMjUgNDAgMjVzMzUtMTAgNDAtMjUiIHN0cm9rZT0iI2ZmNDQ0NCIgc3Ryb2tlLXdpZHRoPSI2IiBmaWxsPSJub25lIi8+PHBhdGggZD0iTTUwIDE0MGwxMC0yMGg4MGwxMCAyMHoiIGZpbGw9IiNmZjQ0NDQiLz48cGF0aCBkPSJNNjAgMTQwbDIwLTMwaDQwbDIwIDMweiIgZmlsbD0iI2ZmNjY2NiIvPjxjaXJjbGUgY3g9IjUwIiBjeT0iMTUwIiByPSI4IiBmaWxsPSIjZmY0NDQ0Ii8+PGNpcmNsZSBjeD0iMTUwIiBjeT0iMTUwIiByPSI4IiBmaWxsPSIjZmY0NDQ0Ii8+PC9zdmc+" alt="哪吒">
                    </div>
                    <span class="deco deco-left">🔥</span>
                    <span class="deco deco-right">⚡</span>
                    <div class="role-tag neZha">🔥 哪吒</div>
                </div>
                <div class="btn-group">
                    <input type="file" id="uploadLeft" class="file-hidden" accept="image/*">
                    <button class="upload-btn" onclick="document.getElementById('uploadLeft').click()">📷 换头像</button>
                    <button class="camera-btn-sm" onclick="openCamera('left')">📸 自拍</button>
                </div>
                <h2 style="color:#ff6b35;">玩家一 · 哪吒</h2>
                <div class="score-text">🔥 得分：<span class="score-num" id="scoreNezha">0</span></div>
            </div>
            <div class="single-timer">⏳ 本题倒计时：<span id="timerNezha">10</span> s</div>
            <div class="question-area" id="areaLeft">
                <div class="empty-hint">📚 等待导入题库...</div>
                <div class="type-tag" id="tagLeft" style="display:none"></div>
                <div class="question-text" id="qNezha" style="display:none"></div>
                <div id="optNezha" style="display:none"></div>
            </div>
        </div>

        <div class="player-card right-card">
            <div class="player-info">
                <div class="avatar-wrapper">
                    <div class="avatar-ring right-ring"></div>
                    <div class="avatar-inner">
                        <img id="avatarRight" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMDAgMjAwIj48Y2lyY2xlIGN4PSIxMDAiIGN5PSI5MCIgcj0iNzAiIGZpbGw9IiM2MGIwZmYiLz48Y2lyY2xlIGN4PSI3MCIgY3k9Ijc1IiByPSI4IiBmaWxsPSIjMjIyIi8+PGNpcmNsZSBjeD0iMTMwIiBjeT0iNzUiIHI9IjgiIGZpbGw9IiMyMjIiLz48cGF0aCBkPSJNNzUgMTEwYzUgMTUgMjAgMjUgNDAgMjVzMzUtMTAgNDAtMjUiIHN0cm9rZT0iIzdjNjhlZSIgc3Ryb2tlLXdpZHRoPSI2IiBmaWxsPSJub25lIi8+PHBhdGggZD0iTTQwIDE0MGwxMC0zMGgxMDBsMTAgMzB6IiBmaWxsPSIjN2M2OGVlIi8+PHBhdGggZD0iTTUwIDE0MGwyMC00MGg2MGwyMCA0MHoiIGZpbGw9IiM5YjhiZmYiLz48cGF0aCBkPSJNMzUgMTUwbDUsLTEwaDEyMGw1LDEweiIgZmlsbD0iIzdjNjhlZSIvPjxjaXJjbGUgY3g9IjUwIiBjeT0iMTUwIiByPSI4IiBmaWxsPSIjN2M2OGVlIi8+PGNpcmNsZSBjeD0iMTUwIiBjeT0iMTUwIiByPSI4IiBmaWxsPSIjN2M2OGVlIi8+PC9zdmc+" alt="敖丙">
                    </div>
                    <span class="deco deco-left">❄️</span>
                    <span class="deco deco-right">🌊</span>
                    <div class="role-tag aobing">❄️ 敖丙</div>
                </div>
                <div class="btn-group">
                    <input type="file" id="uploadRight" class="file-hidden" accept="image/*">
                    <button class="upload-btn" onclick="document.getElementById('uploadRight').click()">📷 换头像</button>
                    <button class="camera-btn-sm" onclick="openCamera('right')">📸 自拍</button>
                </div>
                <h2 style="color:#00b4d8;">玩家二 · 敖丙</h2>
                <div class="score-text">❄️ 得分：<span class="score-num" id="scoreAobing">0</span></div>
            </div>
            <div class="single-timer">⏳ 本题倒计时：<span id="timerAobing">10</span> s</div>
            <div class="question-area" id="areaRight">
                <div class="empty-hint">📚 等待导入题库...</div>
                <div class="type-tag" id="tagRight" style="display:none"></div>
                <div class="question-text" id="qAobing" style="display:none"></div>
                <div id="optAobing" style="display:none"></div>
            </div>
        </div>
    </div>

    <div class="tip-popup left-correct">🔥 +1</div>
    <div class="tip-popup left-wrong">💥 -1</div>
    <div class="tip-popup right-correct">❄️ +1</div>
    <div class="tip-popup right-wrong">💧 -1</div>

    <div class="bottom-btn-wrap">
        <button id="restartBtn">🔄 重新开局</button>
    </div>

    <div class="modal" id="endModal">
        <div class="modal-box">
            <h2 id="resultTitle">⚔️ 对战结束</h2>
            <p style="font-size:18px;margin:12px 0;">🔥 哪吒（玩家一）最终得分：<span id="finalNezha" style="color:#ff6b35;font-size:24px;font-weight:bold;">0</span></p>
            <p style="font-size:18px;margin:12px 0;">❄️ 敖丙（玩家二）最终得分：<span id="finalAobing" style="color:#00b4d8;font-size:24px;font-weight:bold;">0</span></p>
            <div class="modal-btns" style="margin-top:20px;">
                <button id="modalReset" style="padding:12px 36px;background:linear-gradient(135deg,#ff6b35,#ff4500);color:#fff;border:none;border-radius:12px;cursor:pointer;font-size:18px;">🔄 再来一局</button>
            </div>
        </div>
    </div>

    <div class="modal" id="textEditModal">
        <div class="modal-box">
            <h3>📝 题库预览、编辑、自动转换</h3>
            <p class="modal-desc">
                ✅ PPT/Word/Excel/TXT/图片 全格式支持<br>
                ✅ 题目随机生成：单选题 / 判断题随机出现<br>
                ✅ 可手动修改题目、答案、文字
            </p>
            <textarea id="editTextArea" placeholder="解析后的题目内容在这里可自由修改"></textarea>
            <div class="modal-btns">
                <button class="confirm-import" onclick="parseTextToBank()">✅ 确认导入题库</button>
                <button class="close-modal" onclick="closeTextModal()">❌ 取消</button>
            </div>
        </div>
    </div>

    <div class="modal" id="cameraModal">
        <div class="camera-box">
            <video id="cameraVideo" autoplay playsinline muted></video>
            <canvas id="cameraCanvas" width="320" height="320"></canvas>
            <div class="camera-ctrl">
                <button class="take-btn" id="takePhotoBtn">📷 拍照截取</button>
                <button class="confirm-btn" id="confirmPhotoBtn">🔍 识别文字</button>
                <button class="close-camera" id="closeCameraBtn">❌ 关闭</button>
            </div>
        </div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        // ============================================================
        //  背 景 音 乐 控 制
        // ============================================================

        const bgMusic = document.getElementById('bgMusic');
        const musicToggle = document.getElementById('musicToggle');
        const musicIcon = document.getElementById('musicIcon');
        let isMusicPlaying = false;

        // 可用的欢快背景音乐列表（循环使用）
        const musicList = [
            'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3',
            'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3',
            'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3'
        ];
        let currentMusicIndex = 0;

        function toggleMusic() {
            if (isMusicPlaying) {
                bgMusic.pause();
                musicIcon.className = 'fas fa-music';
                musicToggle.classList.add('muted');
                isMusicPlaying = false;
            } else {
                bgMusic.play().catch(() => {});
                musicIcon.className = 'fas fa-volume-up';
                musicToggle.classList.remove('muted');
                isMusicPlaying = true;
            }
        }

        // 当一首歌播放完自动切换到下一首
        bgMusic.addEventListener('ended', function() {
            currentMusicIndex = (currentMusicIndex + 1) % musicList.length;
            bgMusic.src = musicList[currentMusicIndex];
            if (isMusicPlaying) {
                bgMusic.play().catch(() => {});
            }
        });

        // 用户交互时自动播放音乐
        document.addEventListener('click', function musicAutoPlay() {
            if (!isMusicPlaying) {
                bgMusic.src = musicList[0];
                bgMusic.play().catch(() => {});
                musicIcon.className = 'fas fa-volume-up';
                musicToggle.classList.remove('muted');
                isMusicPlaying = true;
            }
            document.removeEventListener('click', musicAutoPlay);
        }, { once: true });

        musicToggle.onclick = toggleMusic;

        // ============================================================
        //  游 戏 逻 辑
        // ============================================================

        let totalQuestionPool = [];
        let usedIndexSet = new Set();
        let scoreN = 0,
            scoreA = 0;
        let totalTime = 90;
        let singleTimeN = 10,
            singleTimeA = 10;
        let gameRunning = false;
        let currQN = null,
            currQA = null;
        let totalTimer, timerN, timerA;
        let mediaStream = null;
        let targetUser = "";
        let isOcrCamera = false;

        const textEditModal = document.getElementById('textEditModal');
        const editTextArea = document.getElementById('editTextArea');
        const cameraModal = document.getElementById("cameraModal");
        const video = document.getElementById("cameraVideo");
        const canvasEl = document.getElementById("cameraCanvas");
        const ctx = canvasEl.getContext("2d");
        const takeBtn = document.getElementById("takePhotoBtn");
        const confirmBtn = document.getElementById("confirmPhotoBtn");
        const closeCamBtn = document.getElementById("closeCameraBtn");
        const allFileInput = document.getElementById('allFileInput');

        function closeTextModal() {
            textEditModal.style.display = "none";
            editTextArea.value = "";
        }

        function closeCamera() {
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            mediaStream = null;
            video.srcObject = null;
            cameraModal.style.display = "none";
            confirmBtn.style.display = "none";
            isOcrCamera = false;
        }

        async function openCamera(side) {
            isOcrCamera = false;
            targetUser = side;
            cameraModal.style.display = "flex";
            confirmBtn.style.display = "none";
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 320,
                        height: 320 }, audio: false });
                video.srcObject = mediaStream;
            } catch (err) {
                alert("摄像头调用失败，请开启相机权限");
                cameraModal.style.display = "none";
            }
        }

        async function openCameraOCR() {
            isOcrCamera = true;
            cameraModal.style.display = "flex";
            confirmBtn.style.display = "none";
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 },
                    audio: false });
                video.srcObject = mediaStream;
            } catch (err) {
                alert("无法调取摄像头");
                cameraModal.style.display = "none";
            }
        }

        takeBtn.onclick = () => {
            ctx.drawImage(video, 0, 0, 320, 320);
            confirmBtn.style.display = "inline-block";
        }

        confirmBtn.onclick = async () => {
            const imgUrl = canvasEl.toDataURL("image/jpeg");
            if (!isOcrCamera) {
                targetUser === "left" ? document.getElementById('avatarLeft').src = imgUrl : document.getElementById(
                    'avatarRight').src = imgUrl;
                closeCamera();
            } else {
                editTextArea.value = "正在识别图片文字，请耐心等候...";
                cameraModal.style.display = "none";
                textEditModal.style.display = "flex";
                const res = await Tesseract.recognize(imgUrl, 'chi_sim');
                editTextArea.value = res.data.text;
            }
        }
        closeCamBtn.onclick = closeCamera;
        window.onbeforeunload = closeCamera;

        // 文件上传解析
        allFileInput.onchange = async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const fileName = file.name.toLowerCase();
            editTextArea.value = "文件解析中，请稍候...";
            textEditModal.style.display = "flex";

            try {
                if (fileName.endsWith('.txt')) {
                    const reader = new FileReader();
                    reader.onload = res => { editTextArea.value = res.target.result; }
                    reader.readAsText(file);
                } else if (fileName.endsWith('.docx')) {
                    const buf = await file.arrayBuffer();
                    const result = await mammoth.convertToText({ arrayBuffer: buf });
                    editTextArea.value = result.value;
                } else if (fileName.endsWith('.xlsx')) {
                    const buf = await file.arrayBuffer();
                    const workbook = XLSX.read(buf);
                    let allText = "";
                    workbook.SheetNames.forEach(sheet => {
                        const json = XLSX.utils.sheet_to_json(workbook.Sheets[sheet], { header: 1 });
                        json.forEach(row => { allText += row.filter(item => item).join(" ") + "\n"; })
                    })
                    editTextArea.value = allText;
                } else if (fileName.endsWith('.pptx')) {
                    const buf = await file.arrayBuffer();
                    const ppt = await PPTXtoJSON.parse(buf);
                    let allText = "";
                    ppt.slides.forEach(slide => {
                        if (slide.text) allText += slide.text + "\n";
                    })
                    editTextArea.value = allText;
                } else if (/\.(jpg|jpeg|png|bmp)$/.test(fileName)) {
                    const res = await Tesseract.recognize(file, 'chi_sim');
                    editTextArea.value = res.data.text;
                } else {
                    editTextArea.value = "暂不支持该格式，请上传：pptx、xlsx、docx、txt、图片";
                }
            } catch (err) {
                editTextArea.value = "解析失败：" + err.message;
            }
            allFileInput.value = '';
        }

        // 核心函数：随机生成单选 / 判断
        function contentToQuestion(text) {
            if (text.includes("|")) {
                let arr = text.split("|");
                if (arr.length >= 7) {
                    return {
                        type: "select",
                        q: arr[1],
                        opts: [arr[2], arr[3], arr[4], arr[5]],
                        ans: Number(arr[6])
                    }
                }
            }

            const isSelect = Math.random() > 0.5;
            if (isSelect) {
                let reg = /[\d\.]+[\+\-\*\/][\d\.]+/;
                let match = text.match(reg);
                let answer = 0;
                if (match) {
                    try {
                        answer = eval(match[0]);
                        answer = Number(answer.toFixed(2));
                    } catch {
                        answer = Math.floor(Math.random() * 60) + 5;
                    }
                } else {
                    answer = Math.floor(Math.random() * 60) + 5;
                }
                let options = [String(answer)];
                while (options.length < 4) {
                    let offset = [1, -1, 3, -3, 6, -6, 10, -10][Math.floor(Math.random() * 8)];
                    let wrong = Number((answer + offset).toFixed(2));
                    if (!options.includes(String(wrong))) options.push(String(wrong));
                }
                let ansIdx = Math.floor(Math.random() * 4);
                let finalOpts = ["", "", "", ""];
                finalOpts[ansIdx] = String(answer);
                let p = 0;
                for (let i = 0; i < 4; i++) {
                    if (i !== ansIdx) finalOpts[i] = options[p++];
                }
                return {
                    type: "select",
                    q: text,
                    opts: finalOpts,
                    ans: ansIdx
                }
            } else {
                let rightAnswer = Math.round(Math.random());
                return {
                    type: "judge",
                    q: text,
                    opts: ["正确", "错误"],
                    ans: rightAnswer
                }
            }
        }

        function parseTextToBank() {
            let txt = editTextArea.value.trim();
            if (!txt) { alert("暂无题目内容"); return; }
            let lines = txt.split(/\r?\n/);
            let list = [];
            lines.forEach(line => {
                let s = line.trim();
                if (s) list.push(contentToQuestion(s));
            })
            totalQuestionPool = [...totalQuestionPool, ...list];
            alert(`成功导入${list.length}道题目，单选、判断题随机抽取作答`);
            closeTextModal();
            startGameAfterLoad();
        }

        function getRandomQuestion() {
            let avail = [];
            for (let i = 0; i < totalQuestionPool.length; i++) {
                if (!usedIndexSet.has(i)) avail.push(i);
            }
            if (avail.length === 0) return null;
            let idx = avail[Math.floor(Math.random() * avail.length)];
            usedIndexSet.add(idx);
            return totalQuestionPool[idx];
        }

        function renderLeft() {
            currQN = getRandomQuestion();
            let domQ = document.getElementById('qNezha');
            let domOpt = document.getElementById('optNezha');
            let tag = document.getElementById('tagLeft');
            if (!currQN) {
                domQ.innerText = "🎉 全部题目已完成！";
                domOpt.innerHTML = "";
                return;
            }
            domQ.innerText = currQN.q;
            domOpt.innerHTML = "";
            if (currQN.type === "select") {
                tag.innerText = "【单选题】";
                domOpt.className = "option-grid-four";
            } else {
                tag.innerText = "【判断题】";
                domOpt.className = "option-grid-two";
            }
            currQN.opts.forEach((item, i) => {
                let div = document.createElement("div");
                div.className = "option-item";
                div.innerText = item;
                div.onclick = () => chooseLeft(i);
                domOpt.appendChild(div);
            })
            singleTimeN = 10;
            document.getElementById('timerNezha').innerText = singleTimeN;
        }

        function renderRight() {
            currQA = getRandomQuestion();
            let domQ = document.getElementById('qAobing');
            let domOpt = document.getElementById('optAobing');
            let tag = document.getElementById('tagRight');
            if (!currQA) {
                domQ.innerText = "🎉 全部题目已完成！";
                domOpt.innerHTML = "";
                return;
            }
            domQ.innerText = currQA.q;
            domOpt.innerHTML = "";
            if (currQA.type === "select") {
                tag.innerText = "【单选题】";
                domOpt.className = "option-grid-four";
            } else {
                tag.innerText = "【判断题】";
                domOpt.className = "option-grid-two";
            }
            currQA.opts.forEach((item, i) => {
                let div = document.createElement("div");
                div.className = "option-item";
                div.innerText = item;
                div.onclick = () => chooseRight(i);
                domOpt.appendChild(div);
            })
            singleTimeA = 10;
            document.getElementById('timerAobing').innerText = singleTimeA;
        }

        function chooseLeft(idx) {
            if (!gameRunning || !currQN) return;
            if (idx === currQN.ans) { scoreN++;
                showTip(".left-correct"); } else { scoreN--;
                showTip(".left-wrong"); }
            document.getElementById('scoreNezha').innerText = scoreN;
            renderLeft();
        }

        function chooseRight(idx) {
            if (!gameRunning || !currQA) return;
            if (idx === currQA.ans) { scoreA++;
                showTip(".right-correct"); } else { scoreA--;
                showTip(".right-wrong"); }
            document.getElementById('scoreAobing').innerText = scoreA;
            renderRight();
        }

        function showTip(sel) {
            let el = document.querySelector(sel);
            el.style.display = "block";
            setTimeout(() => el.style.display = "none", 600);
        }

        function clearAllTimers() {
            clearInterval(totalTimer);
            clearInterval(timerN);
            clearInterval(timerA);
        }

        function startTimers() {
            totalTimer = setInterval(() => {
                totalTime--;
                document.getElementById('totalCount').innerText = totalTime;
                if (totalTime <= 0) gameOver();
            }, 1000);
            timerN = setInterval(() => {
                singleTimeN--;
                document.getElementById('timerNezha').innerText = singleTimeN;
                if (singleTimeN <= 0) { scoreN--;
                    document.getElementById('scoreNezha').innerText = scoreN;
                    showTip(".left-wrong");
                    renderLeft(); }
            }, 1000);
            timerA = setInterval(() => {
                singleTimeA--;
                document.getElementById('timerAobing').innerText = singleTimeA;
                if (singleTimeA <= 0) { scoreA--;
                    document.getElementById('scoreAobing').innerText = scoreA;
                    showTip(".right-wrong");
                    renderRight(); }
            }, 1000);
        }

        function gameOver() {
            gameRunning = false;
            clearAllTimers();
            document.getElementById('finalNezha').innerText = scoreN;
            document.getElementById('finalAobing').innerText = scoreA;
            let title;
            if (scoreN > scoreA) title = "🔥 哪吒获胜！";
            else if (scoreA > scoreN) title = "❄️ 敖丙获胜！";
            else title = "⚖️ 双方平局！";
            document.getElementById('resultTitle').innerText = title;
            document.getElementById('endModal').style.display = "flex";
        }

        function resetGame() {
            if (totalQuestionPool.length === 0) { alert("请先上传导入题库"); return; }
            clearAllTimers();
            usedIndexSet.clear();
            scoreN = 0;
            scoreA = 0;
            totalTime = 90;
            singleTimeN = 10;
            singleTimeA = 10;
            gameRunning = true;
            document.getElementById('scoreNezha').innerText = 0;
            document.getElementById('scoreAobing').innerText = 0;
            document.getElementById('totalCount').innerText = 90;
            document.getElementById('timerNezha').innerText = 10;
            document.getElementById('timerAobing').innerText = 10;
            document.getElementById('endModal').style.display = "none";
            renderLeft();
            renderRight();
            startTimers();
        }

        function startGameAfterLoad() {
            document.querySelectorAll(".empty-hint").forEach(el => el.style.display = "none");
            document.getElementById('tagLeft').style.display = "inline-block";
            document.getElementById('qNezha').style.display = "block";
            document.getElementById('optNezha').style.display = "grid";
            document.getElementById('tagRight').style.display = "inline-block";
            document.getElementById('qAobing').style.display = "block";
            document.getElementById('optAobing').style.display = "grid";
            resetGame();
        }

        document.getElementById('restartBtn').onclick = resetGame;
        document.getElementById('modalReset').onclick = resetGame;

        // 头像上传
        document.getElementById('uploadLeft').onchange = function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    document.getElementById('avatarLeft').src = ev.target.result;
                }
                reader.readAsDataURL(file);
            }
        }
        document.getElementById('uploadRight').onchange = function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    document.getElementById('avatarRight').src = ev.target.result;
                }
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
