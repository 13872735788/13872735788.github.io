<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课堂分组互动积分系统</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.4.21/mammoth.browser.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        :root {
            --bg-main: #1a1d24;
            --bg-card: #272b33;
            --bg-hover: #323842;
            --text-primary: #ffffff;
            --text-secondary: #b0b8c4;
            --accent: #409eff;
            --success: #67c23a;
            --danger: #f56c6c;
            --warning: #e6a23c;
            --border: #3a3f48;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header-bar {
            height: 60px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 12px;
            flex-shrink: 0;
            box-shadow: var(--shadow);
            flex-wrap: wrap;
        }
        .header-bar h1 {
            font-size: 18px;
            font-weight: 600;
            margin-right: 10px;
            white-space: nowrap;
        }
        .btn {
            padding: 7px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:hover {
            background: #66b1ff;
        }
        .btn-default {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .btn-default:hover {
            background: #404752;
        }
        .btn-success {
            background: var(--success);
            color: #fff;
        }
        .btn-success:hover {
            background: #85ce61;
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-danger:hover {
            background: #f78989;
        }
        select.btn {
            appearance: none;
            padding-right: 28px;
            background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23b0b8c4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 8px center;
            min-width: 120px;
        }
        .main-container {
            flex: 1;
            display: grid;
            grid-template-columns: 260px 1fr 280px;
            gap: 12px;
            padding: 12px;
            overflow: hidden;
        }
        .panel {
            background: var(--bg-card);
            border-radius: 10px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .panel-title {
            height: 46px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            font-size: 15px;
            font-weight: 500;
            flex-shrink: 0;
        }
        .panel-content {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
        }
        .history-item {
            padding: 8px 10px;
            border-radius: 6px;
            background: var(--bg-hover);
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .history-item span {
            color: var(--accent);
            font-weight: 500;
        }
        .center-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
        }
        .call-show-box {
            height: 160px;
            background: var(--bg-card);
            border-radius: 10px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
            color: var(--accent);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        @keyframes rollCall {
            0% {
                transform: translateY(20px);
                opacity: 0;
            }
            50% {
                transform: translateY(-10px);
                opacity: 1;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .call-animate {
            animation: rollCall 0.8s ease-out;
        }
        .group-wrap {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(var(--col-num, 3), 1fr);
        }
        .group-card {
            background: var(--bg-hover);
            border-radius: 8px;
            border: 1px solid var(--border);
            padding: 10px;
            max-height: 360px;
            display: flex;
            flex-direction: column;
        }
        .ungroup-card {
            min-height: 180px;
            background: #2c313a;
            border: 1px dashed #777;
            max-height: unset;
        }
        .group-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 4px;
        }
        .group-name {
            font-weight: 500;
            font-size: 14px;
        }
        .group-score {
            color: var(--warning);
            font-weight: bold;
        }
        .group-head-ops {
            display: flex;
            gap: 6px;
        }
        .group-head-ops button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            padding: 2px 5px;
        }
        .edit-group-btn:hover {
            color: var(--accent);
        }
        .del-group:hover {
            color: var(--danger);
        }
        .student-list {
            min-height: 60px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            flex: 1;
            padding-right: 4px;
        }
        .student-card {
            padding: 7px 10px;
            background: var(--bg-card);
            border-radius: 5px;
            border: 1px solid var(--border);
            cursor: grab;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            transition: background 0.2s;
            flex-shrink: 0;
            gap: 6px;
        }
        .student-card:active {
            cursor: grabbing;
        }
        .student-card:hover {
            background: #3a414d;
        }
        .stu-score {
            color: var(--success);
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }
        .stu-operate {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: wrap;
        }
        .stu-operate button {
            width: 22px;
            height: 22px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }
        .stu-operate button:active {
            transform: scale(0.85);
        }
        .add-score {
            background: var(--success);
            color: #fff;
        }
        .sub-score {
            background: var(--danger);
            color: #fff;
        }
        .stu-del {
            background: #666;
            color: #fff;
        }
        .rank-tab {
            display: flex;
            gap: 8px;
        }
        .tab-btn {
            padding: 4px 10px;
            border-radius: 4px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .tab-btn.active {
            background: var(--accent);
            color: #fff;
        }
        .rank-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 0;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        .rank-top1 {
            color: #ffd700;
        }
        .rank-top2 {
            color: #c0c0c0;
        }
        .rank-top3 {
            color: #cd7f32;
        }
        .rank-del-btn {
            background: transparent;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 14px;
            padding: 2px 6px;
        }
        .rank-del-btn:hover {
            background: rgba(245, 108, 108, 0.15);
            border-radius: 4px;
        }
        .modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .modal-box {
            width: 620px;
            max-width: 95vw;
            background: var(--bg-card);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid var(--border);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-title {
            font-size: 16px;
            margin-bottom: 16px;
            font-weight: 500;
        }
        .modal-footer {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }
        textarea,
        input,
        select {
            width: 100%;
            padding: 10px;
            background: var(--bg-hover);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #fff;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .drag-over {
            border: 1px dashed var(--accent) !important;
            background: rgba(64, 158, 255, 0.1);
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #4a505c;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        .import-tips {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.6;
            padding: 8px;
            background: rgba(64, 158, 255, 0.1);
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .split-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .split-row select {
            flex: 1;
            margin: 0;
            padding: 8px;
        }
        .upload-box {
            border: 2px dashed var(--border);
            padding: 14px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            margin: 8px 0;
            transition: 0.2s;
        }
        .upload-box:hover {
            border-color: var(--accent);
            background: rgba(64, 158, 255, 0.05);
        }
        .upload-box.active {
            border-color: var(--success);
            background: rgba(103, 194, 58, 0.08);
        }
        .file-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 10px;
        }
        .file-row .upload-box {
            padding: 10px 6px;
            font-size: 12px;
        }
        .file-row .upload-box i {
            font-size: 24px;
        }
        .file-row .upload-box p {
            margin-top: 4px;
            font-size: 11px;
        }
        .radio-row {
            display: flex;
            gap: 20px;
            margin: 8px 0 12px;
            flex-wrap: wrap;
        }
        .empty-tip {
            color: #888;
            text-align: center;
            padding: 15px 0;
            font-size: 13px;
        }
        .audio-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .audio-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            transition: background 0.3s;
        }
        .audio-dot.inactive {
            background: #555;
        }
        .ocr-status {
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            margin: 6px 0;
            background: rgba(64, 158, 255, 0.1);
            color: var(--text-secondary);
            display: none;
        }
        .ocr-status.active {
            display: block;
        }
        .ocr-status.success {
            background: rgba(103, 194, 58, 0.15);
            color: var(--success);
        }
        .ocr-status.error {
            background: rgba(245, 108, 108, 0.15);
            color: var(--danger);
        }
        .preview-img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 6px;
            margin: 8px 0;
            border: 1px solid var(--border);
        }
        .export-dropdown {
            position: relative;
            display: inline-block;
        }
        .export-dropdown .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            box-shadow: var(--shadow);
            z-index: 100;
            min-width: 180px;
            padding: 4px 0;
        }
        .export-dropdown .dropdown-menu.show {
            display: block;
        }
        .export-dropdown .dropdown-menu .btn {
            display: flex;
            width: 100%;
            border-radius: 0;
            padding: 8px 16px;
            background: transparent;
            color: var(--text-primary);
            border: none;
            text-align: left;
            font-size: 13px;
        }
        .export-dropdown .dropdown-menu .btn:hover {
            background: var(--bg-hover);
        }
        .import-dropdown {
            position: relative;
            display: inline-block;
        }
        .import-dropdown .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            box-shadow: var(--shadow);
            z-index: 100;
            min-width: 180px;
            padding: 4px 0;
        }
        .import-dropdown .dropdown-menu.show {
            display: block;
        }
        .import-dropdown .dropdown-menu .btn {
            display: flex;
            width: 100%;
            border-radius: 0;
            padding: 8px 16px;
            background: transparent;
            color: var(--text-primary);
            border: none;
            text-align: left;
            font-size: 13px;
        }
        .import-dropdown .dropdown-menu .btn:hover {
            background: var(--bg-hover);
        }
        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto;
            }
            .panel:first-child {
                order: 2;
                max-height: 200px;
            }
            .center-area {
                order: 1;
            }
            .panel:last-child {
                order: 3;
                max-height: 200px;
            }
            .group-wrap {
                grid-template-columns: repeat(var(--col-num-mobile, 2), 1fr);
            }
            .file-row {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 600px) {
            .header-bar h1 {
                font-size: 14px;
            }
            .btn {
                font-size: 11px;
                padding: 5px 8px;
            }
            .call-show-box {
                font-size: 28px;
                height: 100px;
            }
            .group-wrap {
                grid-template-columns: 1fr;
            }
            .file-row {
                grid-template-columns: 1fr 1fr;
            }
            .export-dropdown .dropdown-menu {
                left: auto;
                right: 0;
                min-width: 150px;
            }
        }
    </style>
</head>
<body>

    <header class="header-bar">
        <h1><i class="fas fa-graduation-cap"></i> 课堂分组互动积分系统</h1>
        <button class="btn btn-primary" id="callRandomBtn"><i class="fas fa-bullhorn"></i> 加权点名</button>
        <button class="btn btn-default" id="addGroupBtn"><i class="fas fa-plus"></i> 小组</button>

        <div class="import-dropdown" id="importDropdown">
            <button class="btn btn-default" id="importBtn"><i class="fas fa-file-import"></i> 导入 ▾</button>
            <div class="dropdown-menu" id="importMenu">
                <button class="btn" data-action="import"><i class="fas fa-users"></i> 导入学生名单</button>
                <button class="btn" data-action="restore"><i class="fas fa-upload"></i> 恢复备份数据</button>
            </div>
        </div>

        <div class="export-dropdown" id="exportDropdown">
            <button class="btn btn-default" id="exportBtn"><i class="fas fa-download"></i> 导出 ▾</button>
            <div class="dropdown-menu" id="exportMenu">
                <button class="btn" data-format="word"><i class="fas fa-file-word"></i> 导出 Word (.doc)</button>
                <button class="btn" data-format="pdf"><i class="fas fa-file-pdf"></i> 导出 PDF (.pdf)</button>
                <button class="btn" data-format="excel"><i class="fas fa-file-excel"></i> 导出 Excel (.xlsx)</button>
                <button class="btn" data-format="backup"><i class="fas fa-database"></i> 导出备份 (.json)</button>
            </div>
        </div>

        <select class="btn" id="colCountSelect">
            <option value="2">2列</option>
            <option value="3" selected>3列</option>
            <option value="4">4列</option>
        </select>
        <span class="audio-indicator">
            <span class="audio-dot" id="audioDot"></span>
            <span id="audioStatus">音效就绪</span>
        </span>
    </header>

    <div class="main-container">
        <div class="panel">
            <div class="panel-title">
                <span><i class="fas fa-history"></i> 点名历史</span>
                <button class="btn btn-default" style="height:30px;padding:0 8px;font-size:12px" id="clearHistoryBtn">清空</button>
            </div>
            <div class="panel-content" id="historyBox"></div>

            <div style="border-top:1px solid var(--border);padding:12px;flex-shrink:0;">
                <div class="panel-title" style="padding:0 0 10px;border:none;height:auto;">
                    <span><i class="fas fa-user-times"></i> 未分组学生</span>
                </div>
                <div class="group-card ungroup-card" id="ungroupBox" data-gid="ungroup">
                    <div class="student-list" id="ungroupStudentList"></div>
                </div>
            </div>
        </div>

        <div class="center-area">
            <div class="call-show-box" id="callDisplay">🎯 点击「加权点名」开始</div>
            <div class="group-wrap" id="groupContainer"></div>
        </div>

        <div class="panel">
            <div class="panel-title">
                <span><i class="fas fa-trophy"></i> 积分排行榜</span>
                <div class="rank-tab">
                    <button class="tab-btn active" data-type="student">个人</button>
                    <button class="tab-btn" data-type="group">小组</button>
                </div>
            </div>
            <div class="panel-content" id="rankBox"></div>
        </div>
    </div>

    <div class="modal-mask" id="modalMask">
        <div class="modal-box" id="modalContent"></div>
    </div>

    <script>
        // ============================================================
        //  音 效 系 统
        // ============================================================

        class SoundFX {
            constructor() {
                this.ctx = null;
                this.initialized = false;
            }

            init() {
                if (this.initialized) return;
                try {
                    this.ctx = new(window.AudioContext || window.webkitAudioContext)();
                    this.initialized = true;
                    this.updateStatus(true);
                } catch (e) {
                    console.warn('Web Audio API 不可用');
                    this.updateStatus(false);
                }
            }

            updateStatus(ready) {
                const dot = document.getElementById('audioDot');
                const status = document.getElementById('audioStatus');
                if (dot) {
                    dot.className = 'audio-dot' + (ready ? '' : ' inactive');
                }
                if (status) {
                    status.textContent = ready ? '🔊 音效就绪' : '🔇 音效不可用';
                }
            }

            playCall() {
                if (!this.initialized) this.init();
                if (!this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc1 = this.ctx.createOscillator();
                    const gain1 = this.ctx.createGain();
                    osc1.type = 'sine';
                    osc1.frequency.setValueAtTime(600, now);
                    gain1.gain.setValueAtTime(0.1, now);
                    gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc1.connect(gain1);
                    gain1.connect(this.ctx.destination);
                    osc1.start(now);
                    osc1.stop(now + 0.08);

                    const osc2 = this.ctx.createOscillator();
                    const gain2 = this.ctx.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(523, now + 0.1);
                    osc2.frequency.setValueAtTime(659, now + 0.18);
                    osc2.frequency.setValueAtTime(784, now + 0.26);
                    gain2.gain.setValueAtTime(0.12, now + 0.1);
                    gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc2.connect(gain2);
                    gain2.connect(this.ctx.destination);
                    osc2.start(now + 0.1);
                    osc2.stop(now + 0.4);

                    const osc3 = this.ctx.createOscillator();
                    const gain3 = this.ctx.createGain();
                    osc3.type = 'sine';
                    osc3.frequency.setValueAtTime(1047, now + 0.35);
                    gain3.gain.setValueAtTime(0.08, now + 0.35);
                    gain3.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc3.connect(gain3);
                    gain3.connect(this.ctx.destination);
                    osc3.start(now + 0.35);
                    osc3.stop(now + 0.5);
                } catch (e) {}
            }

            playAddScore() {
                if (!this.initialized) this.init();
                if (!this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const notes = [523, 659, 784];
                    for (let i = 0; i < notes.length; i++) {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(notes[i], now + i * 0.06);
                        gain.gain.setValueAtTime(0.1 - i * 0.01, now + i * 0.06);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.06 + 0.12);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + i * 0.06);
                        osc.stop(now + i * 0.06 + 0.12);
                    }
                } catch (e) {}
            }

            playSubScore() {
                if (!this.initialized) this.init();
                if (!this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const notes = [500, 400, 300];
                    for (let i = 0; i < notes.length; i++) {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(notes[i], now + i * 0.08);
                        gain.gain.setValueAtTime(0.06 - i * 0.01, now + i * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.1);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + i * 0.08);
                        osc.stop(now + i * 0.08 + 0.1);
                    }
                } catch (e) {}
            }

            resume() {
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                    this.updateStatus(true);
                }
            }
        }

        function weightedRandomCall() {
            const allStuIds = appData.students;
            if (allStuIds.length === 0) {
                alert("暂无学生数据，请先导入学生名单！");
                return;
            }
            soundFX.resume();

            const now = Date.now();
            let totalWeight = 0;
            const weightList = [];

            for (const stuId of allStuIds) {
                const info = appData.studentInfo[stuId];
                if (!info) continue;

                const lastTime = appData.lastCallTime[stuId] || 0;
                const interval = now - lastTime;

                const callCount = info.callTimes || 0;
                const callWeight = 1 / (callCount + 1);
                const timeWeight = Math.min(interval / 60000, 10);
                const weight = callWeight * (1 + timeWeight);

                weightList.push({ stuId, weight, callCount, interval });
                totalWeight += weight;
            }

            if (totalWeight === 0) {
                const randomIdx = Math.floor(Math.random() * allStuIds.length);
                const selectedStuId = allStuIds[randomIdx];
                doCall(selectedStuId);
                return;
            }

            let randomVal = Math.random() * totalWeight;
            let selectedStuId = null;

            for (const item of weightList) {
                randomVal -= item.weight;
                if (randomVal <= 0) {
                    selectedStuId = item.stuId;
                    break;
                }
            }

            if (!selectedStuId) {
                selectedStuId = weightList[weightList.length - 1].stuId;
            }

            doCall(selectedStuId);
        }

        function doCall(stuId) {
            const stuInfo = appData.studentInfo[stuId];
            if (!stuInfo) return;

            const now = Date.now();
            appData.lastCallTime[stuId] = now;
            stuInfo.callTimes = (stuInfo.callTimes || 0) + 1;

            appData.history.unshift({
                time: new Date().toLocaleString(),
                stuName: stuInfo.name,
                groupName: getStuGroup(stuId)
            });

            if (appData.history.length > 50) appData.history.pop();
            saveToLocal();

            soundFX.playCall();

            const displayBox = $("#callDisplay");
            displayBox.classList.remove("call-animate");
            void displayBox.offsetWidth;
            displayBox.classList.add("call-animate");
            displayBox.innerHTML = `<i class="fas fa-user-check"></i> ${stuInfo.name}（${getStuGroup(stuId)}）`;
            renderAll();
        }

        function getStuGroup(stuId) {
            for (let g of appData.groups) {
                if (g.students.includes(stuId)) return g.name;
            }
            return "未分组";
        }

        function isUnGroupStudent(stuId) {
            return !appData.groups.some(g => g.students.includes(stuId));
        }

        function changeStudentScore(stuId, num) {
            const stu = appData.studentInfo[stuId];
            if (!stu) return;
            stu.score = Math.max(0, stu.score + num);
            if (num > 0) {
                stu.correctTimes = (stu.correctTimes || 0) + 1;
                soundFX.playAddScore();
            } else {
                stu.wrongTimes = (stu.wrongTimes || 0) + 1;
                soundFX.playSubScore();
            }
            syncGroupTotalScore();
            saveToLocal();
            renderAll();
        }

        function deleteStudent(stuId) {
            if (!confirm("确定永久删除该学生所有积分、点名记录数据？删除后无法恢复！")) return;
            appData.students = appData.students.filter(id => id !== stuId);
            delete appData.studentInfo[stuId];
            delete appData.lastCallTime[stuId];
            appData.groups.forEach(g => g.students = g.students.filter(id => id !== stuId));
            syncGroupTotalScore();
            saveToLocal();
            renderAll();
        }

        function syncGroupTotalScore() {
            appData.groups.forEach(group => {
                let total = 0;
                group.students.forEach(sid => {
                    if (appData.studentInfo[sid]) total += appData.studentInfo[sid].score;
                });
                group.score = total;
            })
        }

                            }
                        }).then(result => {
                            const text = result.data.text;
                            const names = text.split(/\r?\n/)
                                .map(line => line.trim())

            }

        function parseStudentText(text, splitSep, defGroup, targetGid) {
            let lines = text.split(/\r?\n/).map(item => item.trim()).filter(item => item);
            let splitReg;
            if (splitSep === "auto") splitReg = /[,，、\t\s]+/;
            else if (splitSep === "\\t") splitReg = /\t+/;
            else splitReg = new RegExp(`[${splitSep}]+`);

            let saveGroup = null;
            if (targetGid === "new") {
                saveGroup = appData.groups.find(g => g.name === defGroup);
                if (!saveGroup) {
                    saveGroup = { id: "g_" + Date.now(), name: defGroup, score: 0, students: [] };
                    appData.groups.push(saveGroup);
                }
            } else {
                saveGroup = appData.groups.find(g => g.id === targetGid);
            }

            lines.forEach(line => {
                const names = line.split(splitReg).map(p => p.trim()).filter(p => p);
                const stuName = names[0];
                if (!stuName) return;
                const stuId = "stu_" + Date.now() + Math.random().toString(36).slice(2, 6);
                appData.studentInfo[stuId] = { name: stuName, score: 0, callTimes: 0, correctTimes: 0,
                    wrongTimes: 0 };
                appData.students.push(stuId);
                if (saveGroup) saveGroup.students.push(stuId);
            })
        }

        function exportData(format) {
            if (format === 'backup') {
                // 导出JSON备份
                const blob = new Blob([JSON.stringify(appData, null, 2)], { type: "application/json" });
                downloadFile(blob, `课堂积分备份_${new Date().toLocaleDateString()}.json`);
                return;
            }

            if (appData.students.length === 0) {
                alert("暂无数据可导出！");
                return;
            }

            const rows = [
                ['姓名', '小组', '积分', '被点名次数', '答对次数', '答错次数']
            ];

            appData.students.forEach(stuId => {
                const info = appData.studentInfo[stuId];
                if (!info) return;
                rows.push([
                    info.name,
                    getStuGroup(stuId),
                    info.score || 0,
                    info.callTimes || 0,
                    info.correctTimes || 0,
                    info.wrongTimes || 0
                ]);
            });

            rows.push([]);
            rows.push(['小组汇总', '总积分']);
            appData.groups.forEach(g => {
                rows.push([g.name, g.score || 0]);
            });

            if (format === 'excel') {
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.aoa_to_sheet(rows);
                XLSX.utils.book_append_sheet(wb, ws, "课堂积分");
                const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
                const blob = new Blob([wbout], { type: 'application/octet-stream' });
                downloadFile(blob, `课堂积分_${new Date().toLocaleDateString()}.xlsx`);
            } else if (format === 'word') {
                let html = buildWordHtml(rows);
                const blob = new Blob([html], { type: 'application/msword;charset=utf-8' });
                downloadFile(blob, `课堂积分_${new Date().toLocaleDateString()}.doc`);
            } else if (format === 'pdf') {
                let html = buildWordHtml(rows);
                html = html.replace('</head>', `
                    <style>
                        @media print {
                            body { padding: 20px; font-size: 12px; }
                            table { page-break-inside: auto; }
                            tr { page-break-inside: avoid; page-break-after: auto; }
                        }
                    </style>
                </head>`);
                const win = window.open('', '_blank');
                if (win) {
                    win.document.write(html);
                    win.document.close();
                    win.focus();
                    win.print();
                } else {
                    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
                    downloadFile(blob, `课堂积分_${new Date().toLocaleDateString()}.html`);
                    alert("PDF导出：请打开下载的HTML文件，使用浏览器「打印」功能选择「另存为PDF」");
                }
            }
        }

        function buildWordHtml(rows) {
            let html = `
            <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
            <head><meta charset='utf-8'><title>课堂积分统计</title>
            <style>
                body { font-family: '微软雅黑', 'Microsoft YaHei', sans-serif; padding: 20px; }
                h1 { text-align: center; color: #1a1d24; font-size: 22px; }
                .sub-title { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; }
                table { width: 100%; border-collapse: collapse; margin-top: 16px; }
                th { background: #409eff; color: #fff; padding: 10px 12px; border: 1px solid #ddd; text-align: center; }
                td { padding: 8px 12px; border: 1px solid #ddd; text-align: center; }
                tr:nth-child(even) { background: #f5f7fa; }
                .summary { margin-top: 30px; }
                .summary h3 { color: #1a1d24; margin-bottom: 10px; }
                .footer { margin-top: 30px; text-align: center; color: #999; font-size: 12px; border-top: 1px solid #eee; padding-top: 16px; }
            </style>
            </head>
            <body>
                <h1>📊 课堂积分统计报告</h1>
                <div class="sub-title">生成时间：${new Date().toLocaleString()}</div>
                <table>
                    <tr><th>姓名</th><th>小组</th><th>积分</th><th>被点名次数</th><th>答对次数</th><th>答错次数</th></tr>
            `;

            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row || row.length === 0) continue;
                if (row[0] === '小组汇总') {
                    html += `</table>
                    <div class="summary"><h3>📈 小组汇总</h3>
                    <table>
                        <tr><th>小组名称</th><th>总积分</th></tr>
                    `;
                    continue;
                }
                if (row[0] === '' || row[0] === undefined) continue;
                html += `<tr><td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td><td>${row[3]}</td><td>${row[4]}</td><td>${row[5]}</td></tr>`;
            }

            html += `</table>
                <div class="footer">导出时间：${new Date().toLocaleString()}</div>
            </body></html>`;

            return html;
        }

        function downloadFile(blob, filename) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(link.href), 5000);
        }

        // ============================================================
        //  恢 复 备 份 功 能
        // ============================================================

        function restoreBackup() {
            const input = document.createElement("input");
            input.type = "file";
            input.accept = ".json";
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        // 验证数据结构是否完整
                        if (data.students !== undefined && data.studentInfo !== undefined &&
                            data.groups !== undefined && data.history !== undefined &&
                            data.lastCallTime !== undefined) {
                            appData = data;
                            saveToLocal();
                            renderAll();
                            alert("✅ 数据恢复成功！共恢复 " + appData.students.length + " 名学生。");
                        } else {
                            alert("❌ 备份文件格式不完整，请检查文件是否正确。");
                        }
                    } catch (err) {
                        alert("❌ 备份文件格式错误，请检查文件是否为有效的JSON格式。\n" + err.message);
                    }
                }
                reader.readAsText(file);
            }
            input.click();
        }

        // ============================================================
        //  拖 拽 事 件
        // ============================================================

        function initDragEvent() {
            document.addEventListener("dragstart", e => {
                const card = e.target.closest(".student-card");
                if (card) dragStuId = card.dataset.stuid;
            })
            document.addEventListener("dragover", e => {
                const box = e.target.closest("[data-gid]");
                if (box) {
                    e.preventDefault();
                    box.classList.add("drag-over");
                }
            })
            document.addEventListener("dragleave", e => {
                const box = e.target.closest("[data-gid]");
                if (box) box.classList.remove("drag-over");
            })
            document.addEventListener("drop", e => {
                const box = e.target.closest("[data-gid]");
                if (box && dragStuId) {
                    e.preventDefault();
                    box.classList.remove("drag-over");
                    const targetGid = box.dataset.gid;
                    appData.groups.forEach(g => g.students = g.students.filter(id => id !== dragStuId));
                    if (targetGid !== "ungroup") {
                        const targetGroup = appData.groups.find(g => g.id === targetGid);
                        if (targetGroup) targetGroup.students.push(dragStuId);
                    }
                    syncGroupTotalScore();
                    saveToLocal();
                    renderAll();
                }
                dragStuId = null;
            })
        }

        // ============================================================
        //  渲 染 函 数
        // ============================================================

        function renderAll() {
            renderUnGroupStudents();
            renderGroupList();
            renderHistory();
            const activeTab = document.querySelector(".tab-btn.active");
            renderRank(activeTab ? activeTab.dataset.type : "student");
        }

        function renderUnGroupStudents() {
            const wrap = $("#ungroupStudentList");
            const unGroupStuIds = appData.students.filter(id => isUnGroupStudent(id));
            if (unGroupStuIds.length === 0) {
                wrap.innerHTML = '<div class="empty-tip">暂无未分组学生</div>';
                return;
            }
            let html = "";
            unGroupStuIds.forEach(stuId => {
                const stu = appData.studentInfo[stuId];
                html += `
                    <div class="student-card" draggable="true" data-stuid="${stuId}">
                        <span>${stu.name}</span>
                        <div class="stu-operate">
                            <button class="add-score" onclick="changeStudentScore('${stuId}',1)">+</button>
                            <button class="sub-score" onclick="changeStudentScore('${stuId}',-1)">-</button>
                            <span class="stu-score">${stu.score}</span>
                            <button class="stu-del" onclick="deleteStudent('${stuId}')"><i class="fas fa-times"></i></button>
                        </div>
                    </div>
                `;
            })
            wrap.innerHTML = html;
        }

        function renderGroupList() {
            const wrap = $("#groupContainer");
            wrap.innerHTML = "";
            appData.groups.forEach(group => {
                const groupDom = document.createElement("div");
                groupDom.className = "group-card";
                groupDom.dataset.gid = group.id;

                let stuHtml = "";
                group.students.forEach(stuId => {
                    const stu = appData.studentInfo[stuId];
                    if (!stu) return;
                    stuHtml += `
                        <div class="student-card" draggable="true" data-stuid="${stuId}">
                            <span>${stu.name}</span>
                            <div class="stu-operate">
                                <button class="add-score" onclick="changeStudentScore('${stuId}',1)">+</button>
                                <button class="sub-score" onclick="changeStudentScore('${stuId}',-1)">-</button>
                                <span class="stu-score">${stu.score}</span>
                                <button class="stu-del" onclick="deleteStudent('${stuId}')"><i class="fas fa-times"></i></button>
                            </div>
                        </div>
                    `;
                })

                groupDom.innerHTML = `
                    <div class="group-head">
                        <span class="group-name"><i class="fas fa-users"></i> ${group.name}</span>
                        <span class="group-score">总分：${group.score}</span>
                        <div class="group-head-ops">
                            <button class="edit-group-btn" data-gid="${group.id}" title="修改小组名称">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="del-group" data-gid="${group.id}" title="删除小组">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="student-list">${stuHtml || '<div class="empty-tip">暂无学生</div>'}</div>
                `;
                wrap.appendChild(groupDom);
            })

            $$(".edit-group-btn").forEach(btn => {
                btn.onclick = function() {
                    const gid = this.dataset.gid;
                    renameGroup(gid);
                }
            })
            $$(".del-group").forEach(btn => {
                btn.onclick = function() {
                    const gid = this.dataset.gid;
                    deleteGroup(gid);
                }
            })
        }

        function renderHistory() {
            $("#historyBox").innerHTML = appData.history.map(item => `
                <div class="history-item"><span>${item.time}</span> 点名：${item.stuName}【${item.groupName}】</div>
            `).join("");
        }

        function renderRank(type) {
            const box = $("#rankBox");
            let list = [];
            let html = "";
            if (type === "student") {
                list = appData.students.map(id => {
                    const info = appData.studentInfo[id];
                    if (!info) return null;
                    return { id: id, name: info.name, score: info.score };
                }).filter(Boolean).sort((a, b) => b.score - a.score);

                list.forEach((item, idx) => {
                    let cls = "";
                    if (idx === 0) cls = "rank-top1";
                    if (idx === 1) cls = "rank-top2";
                    if (idx === 2) cls = "rank-top3";
                    html += `
                        <div class="rank-item">
                            <span class="${cls}">第${idx+1}名 ${item.name} · ${item.score}分</span>
                            <button class="rank-del-btn" onclick="deleteStudent('${item.id}')" title="删除该学生">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    `;
                })
            } else {
                list = appData.groups.map(g => ({
                    id: g.id,
                    name: g.name,
                    score: g.score
                })).sort((a, b) => b.score - a.score);

                list.forEach((item, idx) => {
                    let cls = "";
                    if (idx === 0) cls = "rank-top1";
                    if (idx === 1) cls = "rank-top2";
                    if (idx === 2) cls = "rank-top3";
                    html += `
                        <div class="rank-item">
                            <span class="${cls}">第${idx+1}名 ${item.name} · 总分${item.score}</span>
                            <button class="rank-del-btn" onclick="deleteGroup('${item.id}')" title="删除该小组">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    `;
                })
            }
            box.innerHTML = html || '<div class="empty-tip">暂无积分数据</div>';
        }

        // ============================================================
        //  事 件 绑 定
        // ============================================================

        function bindEvents() {
            $("#callRandomBtn").onclick = weightedRandomCall;
            $("#addGroupBtn").onclick = () => {
                showModal("新建小组", `<input placeholder="填写小组名称" id="newGroupName">`, () => {
                    const name = $("#newGroupName").value.trim();
                    if (!name) return alert("名称不能为空");
                    appData.groups.push({ id: "g_" + Date.now(), name, score: 0, students: [] });
                    saveToLocal();
                    renderAll();
                })
            }

            // 导入下拉菜单
            $("#importBtn").onclick = function(e) {
                e.stopPropagation();
                const menu = document.getElementById("importMenu");
                menu.classList.toggle("show");
            }

            document.querySelectorAll("#importMenu .btn").forEach(btn => {
                btn.onclick = function(e) {
                    e.stopPropagation();
                    const action = this.dataset.action;
                    document.getElementById("importMenu").classList.remove("show");
                    if (action === 'import') {
                        openImportModal();
                    } else if (action === 'restore') {
                        restoreBackup();
                    }
                }
            });

            // 导出下拉菜单
            $("#exportBtn").onclick = function(e) {
                e.stopPropagation();
                const menu = document.getElementById("exportMenu");
                menu.classList.toggle("show");
            }

            document.querySelectorAll("#exportMenu .btn").forEach(btn => {
                btn.onclick = function(e) {
                    e.stopPropagation();
                    const format = this.dataset.format;
                    document.getElementById("exportMenu").classList.remove("show");
                    exportData(format);
                }
            });

            // 点击其他地方关闭下拉菜单
            document.addEventListener("click", function() {
                document.getElementById("exportMenu").classList.remove("show");
                document.getElementById("importMenu").classList.remove("show");
            });

            $("#colCountSelect").onchange = e => {
                document.documentElement.style.setProperty("--col-num", e.target.value);
                document.documentElement.style.setProperty("--col-num-mobile", Math.min(2, parseInt(e.target.value)));
            };
            $("#clearHistoryBtn").onclick = () => { appData.history = [];
                saveToLocal();
                renderHistory(); }
            $$(".tab-btn").forEach(btn => {
                btn.onclick = () => {
                    $$(".tab-btn").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    renderRank(btn.dataset.type);
                }
            })
        }

        // ============================================================
        //  初 始 化
        // ============================================================

        function initSystem() {
            soundFX.init();
            document.addEventListener('click', () => soundFX.resume(), { once: true });
            document.addEventListener('touchstart', () => soundFX.resume(), { once: true });

            initDragEvent();
            bindEvents();
            renderAll();
            document.documentElement.style.setProperty("--col-num", "3");
            document.documentElement.style.setProperty("--col-num-mobile", "2");
        }
        initSystem();
    </script>
</body>
</html>
