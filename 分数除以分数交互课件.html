    &lt;header class=&quot;max-w-4xl mx-auto mb-8&quot;&gt;
        &lt;h1 class=&quot;text-3xl font-bold mb-4&quot;&gt;分数除以分数：面积模型演示&lt;/h1&gt;
        &lt;p class=&quot;text-lg text-gray-700&quot;&gt;通过面积模型，我们将理解为什么分数除法可以转化为&ldquo;通分后个数除以个数&rdquo;。&lt;/p&gt;
    &lt;/header&gt;

    &lt;main class=&quot;max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8&quot;&gt;
        &lt;!-- 左侧：交互演示区 --&gt;
        &lt;section class=&quot;flex flex-col items-center&quot;&gt;
            &lt;div class=&quot;mb-4 text-xl font-bold&quot;&gt;
                问题：\(\frac{3}{4} \div \frac{2}{3} = ?\)
            &lt;/div&gt;
            &lt;div id=&quot;canvas&quot; class=&quot;canvas-container mb-6&quot;&gt;
                &lt;!-- 动态生成的网格和填充将放在这里 --&gt;
            &lt;/div&gt;
            &lt;div class=&quot;flex gap-4&quot;&gt;
                &lt;button id=&quot;prevBtn&quot; class=&quot;btn-outline&quot; onclick=&quot;changeStep(-1)&quot;&gt;上一步&lt;/button&gt;
                &lt;button id=&quot;nextBtn&quot; class=&quot;btn-primary&quot; onclick=&quot;changeStep(1)&quot;&gt;下一步&lt;/button&gt;
                &lt;button class=&quot;btn-outline&quot; onclick=&quot;reset()&quot;&gt;重置&lt;/button&gt;
            &lt;/div&gt;
        &lt;/section&gt;

        &lt;!-- 右侧：讲解与推导区 --&gt;
        &lt;section class=&quot;bg-white p-6 rounded-xl shadow-sm&quot;&gt;
            &lt;div id=&quot;step1&quot; class=&quot;step-card active&quot;&gt;
                &lt;h2 class=&quot;text-xl font-bold mb-4&quot;&gt;第一步：表示被除数&lt;/h2&gt;
                &lt;p class=&quot;mb-4&quot;&gt;首先，我们用一个长方形表示&ldquo;1&rdquo;。&lt;/p&gt;
                &lt;p&gt;将被除数 &lt;span class=&quot;highlight&quot;&gt;\(\frac{3}{4}\)&lt;/span&gt; 画出来：将长方形横向平均分成4份，涂色其中的3份。&lt;/p&gt;
            &lt;/div&gt;
            &lt;div id=&quot;step2&quot; class=&quot;step-card&quot;&gt;
                &lt;h2 class=&quot;text-xl font-bold mb-4&quot;&gt;第二步：理解除法含义&lt;/h2&gt;
                &lt;p class=&quot;mb-4&quot;&gt;除法 \(\div \frac{2}{3}\) 的意思是：&lt;/p&gt;
                &lt;p class=&quot;text-lg italic&quot;&gt;&ldquo;在 \(\frac{3}{4}\) 里面，包含多少个 \(\frac{2}{3}\) ？&rdquo;&lt;/p&gt;
                &lt;p class=&quot;mt-4&quot;&gt;但是，现在的格子大小不一样，很难直接数出来。我们需要&lt;span class=&quot;highlight&quot;&gt;通分&lt;/span&gt;。&lt;/p&gt;
            &lt;/div&gt;
            &lt;div id=&quot;step3&quot; class=&quot;step-card&quot;&gt;
                &lt;h2 class=&quot;text-xl font-bold mb-4&quot;&gt;第三步：统一标准（通分）&lt;/h2&gt;
                &lt;p class=&quot;mb-4&quot;&gt;为了方便比较，我们将长方形纵向再平均分成3份。&lt;/p&gt;
                &lt;p&gt;现在，整个长方形被分成了 \(4 \times 3 = 12\) 个小格。&lt;/p&gt;
                &lt;ul class=&quot;list-disc ml-6 mt-2&quot;&gt;
                    &lt;li&gt;被除数 \(\frac{3}{4}\) 变成了 &lt;span class=&quot;highlight&quot; style=&quot;color: #FF5600;&quot;&gt;\(\frac{9}{12}\)&lt;/span&gt;（占 &lt;span style=&quot;color: #FF5600; font-weight: bold;&quot;&gt;9&lt;/span&gt; 个橙色小格）&lt;/li&gt;
                    &lt;li&gt;除数 \(\frac{2}{3}\) 变成了 &lt;span class=&quot;highlight&quot; style=&quot;color: #3B82F6;&quot;&gt;\(\frac{8}{12}\)&lt;/span&gt;（占 &lt;span style=&quot;color: #3B82F6; font-weight: bold;&quot;&gt;8&lt;/span&gt; 个蓝色小格）&lt;/li&gt;
                &lt;/ul&gt;
            &lt;/div&gt;
            &lt;div id=&quot;step4&quot; class=&quot;step-card&quot;&gt;
                &lt;h2 class=&quot;text-xl font-bold mb-4&quot;&gt;第四步：个数除以个数&lt;/h2&gt;
                &lt;p class=&quot;mb-4&quot;&gt;现在问题变成了：&lt;/p&gt;
                &lt;p class=&quot;text-lg font-bold&quot;&gt;&ldquo;&lt;span style=&quot;color: #FF5600;&quot;&gt;9个小格&lt;/span&gt;里面包含多少个&lt;span style=&quot;color: #3B82F6;&quot;&gt;8个小格&lt;/span&gt;？&rdquo;&lt;/p&gt;
                &lt;p class=&quot;mt-4 text-2xl text-center bg-orange-50 p-4 rounded-lg&quot;&gt;
                    \(9 \div 8 = \frac{9}{8}\)
                &lt;/p&gt;
                &lt;p class=&quot;mt-4&quot;&gt;这就是&lt;span class=&quot;highlight&quot;&gt;&ldquo;个数除以个数&rdquo;&lt;/span&gt;的逻辑！&lt;/p&gt;
            &lt;/div&gt;
        &lt;/section&gt;
    &lt;/main&gt;

    &lt;script&gt;
        let currentStep = 1;
        const totalSteps = 4;
        const canvas = document.getElementById('canvas');

        function initCanvas() {
            canvas.innerHTML = '';
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            const margin = 40;
            const rectW = width - margin * 2;
            const rectH = height - margin * 2;

            // 绘制大背景矩形
            const bg = document.createElement('div');
            bg.className = 'grid-rect';
            bg.style.left = margin + 'px';
            bg.style.top = margin + 'px';
            bg.style.width = rectW + 'px';
            bg.style.height = rectH + 'px';
            bg.style.backgroundColor = '#f9f9f9';
            canvas.appendChild(bg);

            if (currentStep &gt;= 1) {
                // 绘制 3/4 的填充
                const fill = document.createElement('div');
                fill.id = 'fillArea';
                fill.className = 'fill-rect';
                fill.style.left = margin + 'px';
                fill.style.top = margin + 'px';
                fill.style.width = (rectW * 3 / 4) + 'px';
                fill.style.height = rectH + 'px';
                fill.style.backgroundColor = 'rgba(255, 86, 0, 0.15)';
                fill.style.borderRight = '2px solid var(--primary)';
                canvas.appendChild(fill);

                // 绘制 4 个横向格子线
                for (let i = 1; i &lt; 4; i++) {
                    const line = document.createElement('div');
                    line.style.position = 'absolute';
                    line.style.left = (margin + rectW * i / 4) + 'px';
                    line.style.top = margin + 'px';
                    line.style.width = '1px';
                    line.style.height = rectH + 'px';
                    line.style.backgroundColor = '#ccc';
                    canvas.appendChild(line);
                }
            }

            if (currentStep &gt;= 3) {
                // 绘制纵向通分线（2条线分3份）
                for (let i = 1; i &lt; 3; i++) {
                    const vLine = document.createElement('div');
                    vLine.className = 'v-line';
                    vLine.style.position = 'absolute';
                    vLine.style.left = margin + 'px';
                    vLine.style.top = (margin + rectH * i / 3) + 'px';
                    vLine.style.width = rectW + 'px';
                    vLine.style.height = '1px';
                    vLine.style.backgroundColor = '#999';
                    vLine.style.borderTop = '1px dashed #666';
                    canvas.appendChild(vLine);
                }

                // 标记小格
                if (currentStep === 4) {
                    const unitW = rectW / 4;
                    const unitH = rectH / 3;
                    
                    // 1. 标记除数的 8 个格 (蓝色背景 + 蓝色数字)
                    // 除数 2/3 在 12 格中占 8 格，即前两行全部(8格)
                    for(let i=0; i&lt;8; i++) {
                        const col = i % 4;
                        const row = Math.floor(i / 4);
                        
                        const bg = document.createElement('div');
                        bg.style.position = 'absolute';
                        bg.style.left = (margin + col * unitW) + 'px';
                        bg.style.top = (margin + row * unitH) + 'px';
                        bg.style.width = unitW + 'px';
                        bg.style.height = unitH + 'px';
                        bg.style.backgroundColor = 'rgba(59, 130, 246, 0.2)';
                        bg.style.border = '1px solid #3B82F6';
                        canvas.appendChild(bg);

                        const num = document.createElement('div');
                        num.innerText = i + 1;
                        num.style.position = 'absolute';
                        num.style.left = (margin + col * unitW + 5) + 'px';
                        num.style.top = (margin + row * unitH + 5) + 'px';
                        num.style.color = '#3B82F6';
                        num.style.fontSize = '12px';
                        num.style.fontWeight = 'bold';
                        canvas.appendChild(num);
                    }

                    // 2. 标记被除数的 9 个格 (橙色圆圈数字)
                    // 被除数 3/4 在 12 格中占 9 格，即前三列全部(9格)
                    for(let i=0; i&lt;9; i++) {
                        const col = Math.floor(i / 3);
                        const row = i % 3;
                        
                        const dot = document.createElement('div');
                        dot.innerText = i + 1;
                        dot.style.position = 'absolute';
                        dot.style.left = (margin + col * unitW + unitW/2 - 10) + 'px';
                        dot.style.top = (margin + row * unitH + unitH/2 - 10) + 'px';
                        dot.style.width = '20px';
                        dot.style.height = '20px';
                        dot.style.lineHeight = '20px';
                        dot.style.textAlign = 'center';
                        dot.style.borderRadius = '50%';
                        dot.style.backgroundColor = 'rgba(255, 86, 0, 0.8)';
                        dot.style.color = 'white';
                        dot.style.fontWeight = 'bold';
                        dot.style.fontSize = '12px';
                        dot.style.boxShadow = '0 2px 4px rgba(0,0,0,0.2)';
                        canvas.appendChild(dot);
                    }

                    const labelDivisor = document.createElement('div');
                    labelDivisor.innerHTML = '&lt;span style=&quot;color:#3B82F6&quot;&gt;■&lt;/span&gt; 除数包含 8 个蓝格';
                    labelDivisor.style.position = 'absolute';
                    labelDivisor.style.right = '10px';
                    labelDivisor.style.top = (margin + 10) + 'px';
                    labelDivisor.style.fontSize = '12px';
                    canvas.appendChild(labelDivisor);

                    const labelDividend = document.createElement('div');
                    labelDividend.innerHTML = '&lt;span style=&quot;color:#FF5600&quot;&gt;●&lt;/span&gt; 被除数包含 9 个橙格';
                    labelDividend.style.position = 'absolute';
                    labelDividend.style.right = '10px';
                    labelDividend.style.top = (margin + 30) + 'px';
                    labelDividend.style.fontSize = '12px';
                    canvas.appendChild(labelDividend);
                }
            }
        }

        function changeStep(delta) {
            currentStep = Math.max(1, Math.min(totalSteps, currentStep + delta));
            updateUI();
        }

        function updateUI() {
            // 更新文字卡片
            document.querySelectorAll('.step-card').forEach((card, index) =&gt; {
                card.classList.toggle('active', index + 1 === currentStep);
            });

            // 更新按钮状态
            document.getElementById('prevBtn').disabled = currentStep === 1;
            document.getElementById('nextBtn').innerText = currentStep === totalSteps ? '完成' : '下一步';

            initCanvas();

            // 动画效果
            if (currentStep === 3) {
                anime({
                    targets: '.v-line',
                    opacity: [0, 1],
                    translateY: [-20, 0],
                    delay: anime.stagger(100),
                    duration: 800,
                    easing: 'easeOutExpo'
                });
            }
        }

        function reset() {
            currentStep = 1;
            updateUI();
        }

        // 初始化
        window.onload = () =&gt; {
            initCanvas();
            updateUI();
        };
    &lt;/script&gt;

  <script>

    function getIsMobile() {
      const width = document.documentElement.clientWidth
      const isMobile = /Android|webOS|iPhone|iPod|BlackBerry|iPad|Windows Phone|Mobile/i.test(navigator.userAgent) || width <= 768
      return isMobile
    }

    // 打开飞象老师官网
    function openFeixiangTeacher(event) {
      const isMobile = getIsMobile()

      // 判断是否为移动端浏览器
      if (isMobile) {
        // 移动端不跳转
        return
      }
      window.open('https://www.feixianglaoshi.com', '_blank')
    }


    // ==================== 埋点相关代码 ====================

    /**
     * 页面停留时长统计
     */
    (function () {
      let startTime = null
      let totalTime = 0
      let reportTimer = null // 防抖定时器

      // 开始计时
      function startTimer() {
        if (!startTime) {
          startTime = Date.now()
          console.log('[埋点] 开始计时')
        }
      }

      // 停止计时并累加时长
      function stopTimer() {
        if (startTime) {
          totalTime += Date.now() - startTime
          startTime = null
          console.log('[埋点] 停止计时，累计时长:', Math.floor(totalTime / 1000), '秒')
        }
      }

      // 检查页面是否真正可见
      function isPageVisible() {
        // 检查 document.hidden
        if (document.hidden) {
          return false
        }

        // 检查 document.visibilityState
        if (document.visibilityState && document.visibilityState !== 'visible') {
          return false
        }

        // 检查窗口是否有焦点
        if (!document.hasFocus()) {
          return false
        }

        return true
      }

      // 上报停留时长（带防抖）
      function reportStayTime(eventType, immediate = false) {
        stopTimer()

        // 清除之前的定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 如果是立即上报（如页面卸载），不使用防抖
        if (immediate) {
          doReport(eventType)
          return
        }

        // 使用防抖，避免短时间内多次上报
        // 100ms 内如果有多个事件触发，只上报最后一次
        reportTimer = setTimeout(function () {
          doReport(eventType)
          reportTimer = null
        }, 100)
      }

      // 实际执行上报
      function doReport(eventType) {
        if (window.frog && totalTime > 0) {
          const serverData = window.__SERVER_DATA__ || {}
          const chatId = serverData.watermarkChatId
          window.frog.add({
            url: '/time/HtmlPage/enter',
            eventId: 42818,
            customExtend: {
              chat_id: chatId,
              use_time: Math.floor(totalTime / 1000), // 转换为秒
            },
            duration: Math.floor(totalTime / 1000), // 转换为秒,
            currentPage: 'HtmlPage',
            eventAction: 'time',
            eventName: 'enter'
          })
          console.log(`[埋点] 页面停留时长上报 (${eventType}):`, Math.floor(totalTime / 1000), '秒')

          // 上报后重置累计时长，为下次统计做准备
          totalTime = 0
        }
      }

      // 清理函数：移除所有事件监听器
      function cleanup() {
        console.log('[埋点] 清理计时器资源')

        // 清除防抖定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 移除事件监听器
        document.removeEventListener('visibilitychange', handleVisibilityChange)
        window.removeEventListener('blur', handleBlur)
        window.removeEventListener('focus', handleFocus)
        window.removeEventListener('beforeunload', handleBeforeUnload)
        window.removeEventListener('pagehide', handlePageHide)

        // 重置变量
        startTime = null
        totalTime = 0
      }

      // 事件处理函数（需要命名以便移除）
      function handleVisibilityChange() {
        if (document.hidden) {
          // 页面不可见，停止计时并上报
          console.log('[埋点] visibilitychange - 页面隐藏')
          reportStayTime('visibilitychange')
        } else {
          // 页面可见，开始新的计时
          console.log('[埋点] visibilitychange - 页面显示，开始新的计时')
          startTimer()
        }
      }

      function handleBlur() {
        // 窗口失去焦点，停止计时并上报
        console.log('[埋点] blur - 窗口失去焦点')
        reportStayTime('blur')
      }

      function handleFocus() {
        // 窗口获得焦点，开始新的计时
        console.log('[埋点] focus - 窗口获得焦点，开始新的计时')
        startTimer()
      }

      function handleBeforeUnload() {
        // 页面卸载前立即上报（不使用防抖）
        console.log('[埋点] beforeunload - 页面即将卸载')
        reportStayTime('beforeunload', true)
        cleanup()
      }

      function handlePageHide() {
        // 页面隐藏时立即上报（iOS Safari 更可靠，不使用防抖）
        console.log('[埋点] pagehide - 页面隐藏')
        reportStayTime('pagehide', true)
      }

      function handleDOMContentLoaded() {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 监听页面可见性变化
      document.addEventListener('visibilitychange', handleVisibilityChange)

      // 监听窗口失去/获得焦点
      window.addEventListener('blur', handleBlur)
      window.addEventListener('focus', handleFocus)

      // 页面加载完成后开始计时
      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', handleDOMContentLoaded)
      } else {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 页面卸载时上报
      window.addEventListener('beforeunload', handleBeforeUnload)

      // 兼容性：监听 pagehide 事件（iOS Safari 更可靠）
      window.addEventListener('pagehide', handlePageHide)
    })()

    /**
     * 点击立即体验的埋点
     */
    function trackStartButtonClick(event) {
      // 阻止事件冒泡，避免触发 HTML 点击埋点
      event.stopPropagation()

      if (window.frog) {
        const serverData = window.__SERVER_DATA__ || {}
        const chatId = serverData.watermarkChatId
        console.log('trackHtmlClick', chatId)
        window.frog.add({
          url: '/click/HtmlPage/start',
          eventId: 42817,
          customExtend: {
            chat_id: chatId
          },

          eventAction: 'click',
          eventName: 'start'

    // 绑定点击事件
    document.addEventListener('DOMContentLoaded', function () {
      // 绑定 Logo 点击埋点和跳转功能
      const logoElement = document.querySelector('.left-watermark-content')
      if (logoElement) {
        logoElement.addEventListener('click', function (event) {
          trackLogoClick(event)
          openFeixiangTeacher(event)
        })
      }

      // 绑定立即体验按钮点击埋点和跳转功能
      const startButton = document.querySelector('.jump-button')
      if (startButton) {
        startButton.addEventListener('click', function (event) {
          trackStartButtonClick(event)
          openFeixiangTeacher(event)
        })
      }

      // 绑定水印覆盖层点击（整体区域）
      const watermarkOverlay = document.querySelector('.watermark-overlay')
      if (watermarkOverlay) {
        watermarkOverlay.addEventListener('click', function (event) {
          // 如果点击的不是 logo 或按钮，则触发跳转
          const target = event.target
          const isLogo = target.closest('.left-watermark-content')
          const isButton = target.closest('.jump-button')

          if (!isLogo && !isButton) {
            openFeixiangTeacher(event)
          }
        })
      }
    })

    // ==================== 原有功能代码 ====================

    function adjustRem() {
      const pcBaseWidth = 375 // 设计稿
      const width = document.documentElement.clientWidth
      document.documentElement.style.fontSize = `${(width / pcBaseWidth * 100).toFixed(2)}px`
    }


    // 移动端检测和按钮隐藏逻辑
    function checkAndHideButtonOnMobile() {
      const isMobile = getIsMobile()
      if (isMobile) {
        adjustRem()
      }
      const jumpButton = document.querySelector('.right-watermark-content .jump-button');
      const iframeContainer = document.querySelector('.iframe-container');

      if (isMobile && jumpButton) {
        jumpButton.style.display = 'none';
      } else {
        jumpButton.style.display = 'flex'
      }

      // 移动端时给iframe-container添加类名，否则移除类名
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }


    function handleResize() {
      // 响应式处理：重新检测移动端并处理按钮显示/隐藏
      checkAndHideButtonOnMobile();

      // 在窗口大小变化时，重新应用移动端相关的逻辑
      const isMobile = getIsMobile()
      const watermarkOverlay = document.querySelector('.watermark-overlay');
      const iframeContainer = document.querySelector('.iframe-container');

      // 根据当前设备类型调整水印覆盖层的点击行为
      if (watermarkOverlay) {
        if (isMobile) {
          // 移动端：移除点击事件或设置为空函数
          watermarkOverlay.onclick = function () {
            // 移动端不执行跳转
            return;
          };
        } else {
          // 桌面端：恢复正常的点击跳转功能
          watermarkOverlay.onclick = openFeixiangTeacher;
        }
      }

      // 确保在resize时也能正确添加或移除mobile类
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }

    // 防止iframe内容溢出
    window.addEventListener('resize', handleResize);

    // 页面加载完成后执行移动端检测
    document.addEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);

    // 清理所有事件绑定的函数
    function clearAllEvents() {
      // 清除 resize 事件监听器
      window.removeEventListener('resize', handleResize);

      // 清除 DOMContentLoaded 事件监听器
      document.removeEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);
    }

    // 页面卸载时自动清理事件（可选）
    window.addEventListener('beforeunload', clearAllEvents);

  </script>
